<script>
function copyIt(id, btn) {
  var ta = document.getElementById(id);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(function () { mark(btn); });
    return;
  }
  if (ok) mark(btn); else alert('自动复制没成功，请在文本框里 Ctrl+A 全选后 Ctrl+C 手动复制');
}
function mark(btn) {
  var old = btn.textContent;
  btn.textContent = '已复制，去闲鱼 Ctrl+V 粘贴';
  btn.classList.add('ok');
  setTimeout(function () { btn.textContent = old; btn.classList.remove('ok'); }, 2500);
}
</script>
