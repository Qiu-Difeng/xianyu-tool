<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼辅助工具 · 冬夜漫步</title>
<style>
/* @inject style.css */
</style>
</head>
<body>

<!-- 图标精灵：全部自绘，24x24 网格，1.75 描边，跟随 currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fish" viewBox="0 0 24 24">
      <path d="M3 12c3-4.2 7-6 11-4.2 2 .9 3.2 2.4 3.2 4.2s-1.2 3.3-3.2 4.2C10 18 6 16.2 3 12z"/>
      <path d="M17 8.2L21 5v14l-4-3.2"/>
      <circle cx="8.2" cy="11" r=".95" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-key" viewBox="0 0 24 24">
      <circle cx="8" cy="8" r="4.2"/>
      <path d="M11.2 11.2L20 20M17 17l2.2-2.2M19.2 19.2l2.2-2.2"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20.5 11a8.5 8.5 0 1 0-2.6 6.4"/>
      <path d="M20.5 4.5V11h-6.5"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 1.8"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.2l11 6.8-11 6.8z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="M15.4 15.4L21 21"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="15" rx="2.2"/>
      <circle cx="8.6" cy="9.6" r="1.5"/>
      <path d="M21 15.5l-4.8-4.8L7 19.5"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24">
      <path d="M12 3.2l1.9 4.9 4.9 1.9-4.9 1.9L12 16.8l-1.9-4.9L5.2 10l4.9-1.9z"/>
      <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
    </symbol>
    <symbol id="i-pen" viewBox="0 0 24 24">
      <path d="M4.5 19.5h4L20 8l-4-4L4.5 15.5z"/>
      <path d="M14.5 5.5l4 4"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3.2" y="3.2" width="7.2" height="7.2" rx="1.6"/>
      <rect x="13.6" y="3.2" width="7.2" height="7.2" rx="1.6"/>
      <rect x="3.2" y="13.6" width="7.2" height="7.2" rx="1.6"/>
      <rect x="13.6" y="13.6" width="7.2" height="7.2" rx="1.6"/>
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24">
      <rect x="2.5" y="6" width="13.5" height="12" rx="2.2"/>
      <path d="M16 10.5l5.5-3v9l-5.5-3"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11.5" height="11.5" rx="2.2"/>
      <path d="M5.5 15V6.2A2.2 2.2 0 0 1 7.7 4H15"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3.5v11.5M7.5 10.5L12 15l4.5-4.5"/>
      <path d="M4 19.5h16"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M4.5 12.5l5 5L19.8 6.8"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 3.5l8.8 16H3.2z"/>
      <path d="M12 9.5v4.2"/>
      <circle cx="12" cy="16.6" r=".85" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.8"/>
      <path d="M12 11v5.5"/>
      <circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-error" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.8"/>
      <path d="M9 9l6 6M15 9l-6 6"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5 8.6 8.6 0 1 0 20.5 14.8z"/>
    </symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24">
      <rect x="3" y="4.2" width="18" height="12" rx="2.2"/>
      <path d="M9 20.2h6M12 16.2v4"/>
    </symbol>
    <symbol id="i-loader" viewBox="0 0 24 24">
      <path d="M12 3.2a8.8 8.8 0 1 0 8.8 8.8" stroke-width="2.2"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10.2 13.8a4.6 4.6 0 0 0 6.5 0l2.8-2.8a4.6 4.6 0 0 0-6.5-6.5l-1.4 1.4"/>
      <path d="M13.8 10.2a4.6 4.6 0 0 0-6.5 0l-2.8 2.8a4.6 4.6 0 0 0 6.5 6.5l1.4-1.4"/>
    </symbol>
    <symbol id="i-package" viewBox="0 0 24 24">
      <path d="M12 3l8.2 4.6v8.8L12 21l-8.2-4.6V7.6z"/>
      <path d="M3.8 7.6L12 12.2l8.2-4.6M12 12.2V21"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="3" y="5.5" width="18" height="13" rx="2.2"/>
      <path d="M3.6 7.2l8.4 5.8 8.4-5.8"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.8"/>
      <path d="M3.2 12h17.6M12 3.2c2.4 2.4 3.6 5.4 3.6 8.8s-1.2 6.4-3.6 8.8c-2.4-2.4-3.6-5.4-3.6-8.8S9.6 5.6 12 3.2z"/>
    </symbol>
  </defs>
</svg>

<div class="wallpaper"></div>
<div class="stars" id="stars"></div>
<div class="snowflakes" id="snowflakes"></div>

<div class="header">
  <div class="logo-wrap"><svg class="ico"><use href="#i-fish"/></svg></div>
  <h1>闲鱼辅助工具 <span>· 冬夜漫步</span></h1>
  <span class="sub">链接解析 → 去水印 → 文案改写 → 以图搜图</span>
  <div class="spacer"></div>
  <button class="btn-update icon-only" id="themeBtn" onclick="cycleTheme()" title="切换主题（跟随系统 / 深色 / 浅色）">
    <svg class="ico"><use href="#i-monitor" id="themeUse"/></svg>
  </button>
  <button class="btn-update" id="keyBtn" onclick="showKeyModal()" title="点击配置 API Key">
    <span class="icon-update"><svg class="ico"><use href="#i-key"/></svg></span>
    <span id="keyBtnText">Key 未配置</span>
  </button>
  <button class="btn-update" id="updateBtn" onclick="checkUpdate(true)">
    <span class="dot" id="updateDot"></span>
    <span class="spinner"></span>
    <span class="icon-update"><svg class="ico"><use href="#i-refresh"/></svg></span>
    <span id="updateBtnText">检查更新</span>
  </button>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="粘贴闲鱼商品链接（如 https://m.tb.cn/h.xxx）"
           onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();runTool();}" />
    <span class="icon-search"><svg class="ico"><use href="#i-search"/></svg></span>
  </div>
  <button class="btn-run" id="runBtn" onclick="runTool()">
    <span class="spinner"></span>
    <span class="icon-play"><svg class="ico"><use href="#i-play"/></svg></span>
    <span class="btn-text">开始</span>
  </button>
</div>

<div class="status-progress">
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">就绪 · 等待输入</span>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="log-section">
  <div class="log-header"><svg class="ico"><use href="#i-info"/></svg>运行日志</div>
  <div class="log-box" id="logBox"></div>
</div>

<div class="tabs" id="tabBar">
  <button class="tab-btn active" onclick="switchTab(0)"><svg class="ico"><use href="#i-copy"/></svg> 商品信息</button>
  <button class="tab-btn" onclick="switchTab(1)"><svg class="ico"><use href="#i-image"/></svg> 原图</button>
  <button class="tab-btn" onclick="switchTab(2)"><svg class="ico"><use href="#i-sparkle"/></svg> 去水印</button>
  <button class="tab-btn" onclick="switchTab(3)"><svg class="ico"><use href="#i-pen"/></svg> 文案</button>
  <button class="tab-btn" onclick="switchTab(4)"><svg class="ico"><use href="#i-search"/></svg> 补充图</button>
  <button class="tab-btn" onclick="switchTab(5)"><svg class="ico"><use href="#i-video"/></svg> 视频</button>
  <button class="tab-btn" onclick="switchTab(6)"><svg class="ico"><use href="#i-grid"/></svg> 批量</button>
  <button class="tab-btn tab-btn-action" onclick="showHistoryModal()" title="查看处理过的商品"><svg class="ico"><use href="#i-clock"/></svg> 历史</button>
</div>

<div class="tab-content">
  <div class="tab-pane active" id="pane0">
    <div class="empty">
      <span class="emoji"><svg class="ico"><use href="#i-sparkle"/></svg></span>
      <p>输入链接后点击「开始」，和小新小白一起漫步吧~</p>
    </div>
  </div>
  <div class="tab-pane" id="pane1"></div>
  <div class="tab-pane" id="pane2"></div>
  <div class="tab-pane" id="pane3"></div>
  <div class="tab-pane" id="pane4"></div>
  <div class="tab-pane" id="pane5"></div>

  <div class="tab-pane" id="pane6">
    <div class="queue-box">
      <div class="modal-label">粘贴链接（每行一条，重复与无效行会自动跳过）</div>
      <textarea id="queueText" class="modal-input queue-textarea" placeholder="https://m.tb.cn/h.xxxx&#10;https://m.tb.cn/h.yyyy"></textarea>
      <div class="queue-actions">
        <button class="modal-btn" onclick="queueAdd()"><svg class="ico"><use href="#i-link"/></svg> 加入队列</button>
        <button class="modal-btn primary" id="queueStartBtn" onclick="queueStart()"><svg class="ico"><use href="#i-play"/></svg> 开始处理</button>
        <button class="modal-btn" id="queueStopBtn" onclick="queueStop()"><svg class="ico"><use href="#i-x"/></svg> 停止</button>
        <button class="modal-btn" onclick="queueClear()"><svg class="ico"><use href="#i-check"/></svg> 清除已完成</button>
        <button class="modal-btn" id="queueRetryBtn" onclick="queueRetryFailed()"><svg class="ico"><use href="#i-refresh"/></svg> 重试失败</button>
      </div>
    </div>
    <div id="queueSummary" class="queue-summary">队列为空，先粘贴链接再点「加入队列」</div>
    <div id="queueList" class="queue-list"></div>
  </div>
</div>

<div class="footer">闲鱼辅助工具 v1.6.0 · 后台静默采集 · 一键复制 · V3自定义提示词 · <a href="#" class="footer-link" onclick="showLogModal(); return false;">运行日志</a> · <a href="#" class="footer-link" onclick="showFeedback(); return false;">问题反馈</a> · <a href="#" class="footer-link" onclick="checkUpdate(true); return false;">检查更新</a></div>

</body>
</html>
