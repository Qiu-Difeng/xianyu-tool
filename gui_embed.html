<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼辅助工具 · 冬夜漫步</title>
<style>
@keyframes snowfall {
  0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(105vh) translateX(40px) rotate(360deg); opacity: 0; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.08); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes spinEmoji {
  to { transform: rotate(360deg); }
}
.spinning {
  display: inline-block;
  animation: spinEmoji 1.5s linear infinite;
}

/* ============================================================
   设计令牌
   深色为默认；[data-theme="light"] 覆盖同一批变量。
   --glass* 为旧名，保留以免破坏既有规则；新增语义层给新代码用。
   ============================================================ */
:root {
  color-scheme: dark;

  /* 背景与表面 */
  --wallpaper-a: #090E15;
  --wallpaper-b: #0F1826;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-light: rgba(255, 255, 255, 0.07);
  --field-bg: rgba(0, 0, 0, 0.30);
  --field-bg-strong: rgba(0, 0, 0, 0.42);
  --panel-bg: rgba(0, 0, 0, 0.20);
  --overlay-bg: rgba(4, 8, 14, 0.84);
  --divider: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.20);

  /* 文字 */
  --text: #E8EEF7;
  --text-dim: rgba(232, 238, 247, 0.62);
  --text-faint: rgba(232, 238, 247, 0.38);

  /* 品牌与语义 */
  --accent: #E05138;
  --accent2: #F0A03C;
  --accent-grad: linear-gradient(135deg, #E05138 0%, #F0A03C 100%);
  --accent-soft: rgba(224, 81, 56, 0.15);
  --success: #43C08A;
  --success-soft: rgba(67, 192, 138, 0.14);
  --warn: #E9B44C;
  --warn-soft: rgba(233, 180, 76, 0.14);
  --error: #E4573D;
  --error-soft: rgba(228, 87, 61, 0.14);

  /* 形状与层次 */
  --radius: 18px;
  --radius-sm: 10px;
  --radius-xs: 7px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
}

:root[data-theme="light"] {
  color-scheme: light;

  --wallpaper-a: #EBEEF2;
  --wallpaper-b: #F8F9FB;
  --glass: rgba(255, 255, 255, 0.88);
  --glass-border: rgba(18, 26, 38, 0.10);
  --glass-light: rgba(18, 26, 38, 0.045);
  --field-bg: rgba(18, 26, 38, 0.045);
  --field-bg-strong: rgba(18, 26, 38, 0.07);
  --panel-bg: rgba(18, 26, 38, 0.035);
  --overlay-bg: rgba(24, 32, 44, 0.48);
  --divider: rgba(18, 26, 38, 0.08);
  --border-strong: rgba(18, 26, 38, 0.16);

  --text: #131A24;
  --text-dim: rgba(19, 26, 36, 0.64);
  --text-faint: rgba(19, 26, 36, 0.40);

  --accent: #CF4025;
  --accent2: #B8721A;
  --accent-grad: linear-gradient(135deg, #CF4025 0%, #C87A22 100%);
  --accent-soft: rgba(207, 64, 37, 0.10);
  --success: #17855A;
  --success-soft: rgba(23, 133, 90, 0.10);
  --warn: #9A6B0F;
  --warn-soft: rgba(154, 107, 15, 0.10);
  --error: #B93A24;
  --error-soft: rgba(185, 58, 36, 0.10);

  --shadow: 0 12px 32px rgba(19, 26, 36, 0.12);
  --shadow-sm: 0 2px 8px rgba(19, 26, 36, 0.07);
}

/* 亮色下去掉氛围装饰，保证可读性 */
:root[data-theme="light"] .wallpaper { display: none; }
:root[data-theme="light"] .stars,
:root[data-theme="light"] .snowflakes { display: none; }

/* 图标基础样式：所有 emoji 已替换为内联 SVG */
.ico {
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.125em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.ico-lg { width: 40px; height: 40px; stroke-width: 1.4; }
.ico-xl { width: 56px; height: 56px; stroke-width: 1.2; }

/* 纯图标按钮 */
.btn-update.icon-only { padding: 8px 10px; gap: 0; }
.btn-update.icon-only .ico { width: 15px; height: 15px; }

/* 日志级别用色点表示，不再依赖 emoji */
.log-line { position: relative; padding-left: 14px; }
.log-line::before {
  content: '';
  position: absolute;
  left: 2px;
  top: 0.62em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-faint);
}
.log-line.success::before { background: var(--success); }
.log-line.error::before { background: var(--error); }
.log-line.warn::before { background: var(--warn); }
.log-line.accent::before { background: var(--accent2); }

/* ============================================================
   通用语义类（替代零散内联样式）
   ============================================================ */
.footer-link { color: var(--accent2); text-decoration: none; }
.footer-link:hover { text-decoration: underline; }

.modal-textarea-lg { height: 200px; resize: none; font-size: 11px; line-height: 1.5; }
.modal-textarea-md { height: 120px; resize: none; margin-bottom: 12px; }

.warn-box { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.warn-text { margin: 0; color: var(--warn); font-size: 12px; line-height: 1.6; }

.code-box {
  background: var(--field-bg);
  border-radius: 10px;
  padding: 14px;
  text-align: left;
}
.code-pre {
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  font-size: 13px;
  line-height: 1.6;
  margin: 0;
  font-family: inherit;
}
.log-box-scroll {
  background: var(--field-bg);
  border-radius: 10px;
  padding: 14px;
  max-height: 340px;
  overflow: auto;
  text-align: left;
}
.log-pre {
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.6;
  margin: 0;
  font-family: ui-monospace, Consolas, monospace;
}
.mail-box { background: var(--accent-soft); border-radius: 10px; padding: 14px; margin-bottom: 6px; }
.mail-label { font-size: 12px; color: var(--text-dim); margin: 0 0 6px; }
.mail-addr { font-size: 16px; color: var(--accent2); font-weight: 600; user-select: text; margin: 0; }

/* ============================================================
   批量队列
   ============================================================ */
.queue-box { margin-bottom: 16px; }
.queue-textarea {
  width: 100%;
  height: 96px;
  resize: vertical;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 10px;
}
.queue-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.queue-actions .modal-btn,
.queue-actions .modal-btn.primary { flex: 0 0 auto; padding: 9px 18px; font-size: 13px; }
.queue-summary {
  background: var(--panel-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text-dim);
}
.queue-progress { height: 6px; background: var(--divider); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.queue-progress-bar { height: 100%; width: 0; background: var(--accent-grad); border-radius: 3px; transition: width 0.4s ease; }
.queue-stats { display: flex; gap: 14px; flex-wrap: wrap; }
.queue-stats .qs-ok { color: var(--success); }
.queue-stats .qs-fail { color: var(--error); }
.queue-stats .qs-run { color: var(--accent2); }
.queue-list { display: flex; flex-direction: column; gap: 8px; }
.queue-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--glass-light);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  font-size: 12px;
  animation: fadeInUp 0.3s ease;
}
.queue-item .qi-ico { width: 18px; flex-shrink: 0; text-align: center; color: var(--text-faint); }
.queue-item.running .qi-ico { color: var(--accent2); }
.queue-item.done .qi-ico { color: var(--success); }
.queue-item.failed .qi-ico { color: var(--error); }
.queue-item .qi-main { flex: 1; min-width: 0; }
.queue-item .qi-title {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-item .qi-sub {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-item.failed .qi-sub { color: var(--error); }
.queue-item .qi-btn {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid var(--glass-border);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.queue-item .qi-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.spin-ico { display: inline-block; animation: spin 0.9s linear infinite; }

/* ============================================================
   弹窗组件
   原先 7 个弹窗各自在 JS 里拼一整套内联样式（约 400 行重复代码），
   改样式要翻 JS 字符串，且深色/浅色两套主题无法统一维护。
   现在骨架样式收敛到这里，弹窗内容只负责各自的业务字段。
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  animation: fadeIn 0.25s ease;
  overflow-y: auto;
  padding: 24px 16px;
}
.modal-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 26px 30px;
  max-width: 480px;
  width: 100%;
  box-shadow: var(--shadow);
  animation: fadeInUp 0.3s ease;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-card.modal-wide { max-width: 560px; }
.modal-icon { text-align: center; margin-bottom: 8px; color: var(--accent2); }
.modal-icon .ico { width: 40px; height: 40px; }
.modal-title { color: var(--text); margin: 0 0 10px; font-size: 19px; text-align: center; }
.modal-desc { color: var(--text-dim); font-size: 13px; line-height: 1.7; margin: 0 0 16px; text-align: center; }
.modal-hint { font-size: 12px; min-height: 18px; margin: 0 0 12px; line-height: 1.5; }
.modal-hint.error { color: var(--error); }
.modal-hint.success { color: var(--success); }
.modal-hint.warn { color: var(--warn); }
.modal-actions { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.modal-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.modal-btn.primary { flex: 2; background: var(--accent-grad); color: #fff; border: none; font-weight: 600; }
.modal-btn.primary:hover { filter: brightness(1.08); color: #fff; }
.modal-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.modal-foot { color: var(--text-faint); font-size: 11px; margin: 12px 0 0; text-align: center; line-height: 1.6; }
.modal-field { margin-bottom: 12px; }
.modal-label { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.modal-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: var(--field-bg);
  color: var(--text);
  font-size: 14px;
  box-sizing: border-box;
  font-family: inherit;
}
.modal-input.mono { font-family: ui-monospace, Consolas, monospace; }
.modal-input:focus { outline: none; border-color: var(--accent2); }
.modal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
.modal-check { color: var(--text-dim); font-size: 12px; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; }
.modal-link { color: var(--accent2); font-size: 12px; cursor: pointer; }
.modal-link:hover { text-decoration: underline; }
.modal-select {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: var(--field-bg);
  color: var(--text);
  font-size: 14px;
  box-sizing: border-box;
}
.modal-section { border-top: 1px solid var(--glass-border); padding-top: 14px; margin-bottom: 12px; }
.modal-section-title { color: var(--text); font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.modal-grid2 { display: flex; gap: 8px; }
.modal-grid2 > *:first-child { flex: 2; }
.modal-grid2 > *:last-child { flex: 1; }
.guide-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 22px; }
.guide-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--divider); transition: all 0.3s ease; }
.guide-dot.active { width: 24px; background: var(--accent2); }
.modal-note { color: var(--text-faint); font-size: 11px; line-height: 1.6; margin: 12px 0 0; }

body, .tab-content, .info-card, .footer, .btn-update, .input-wrap input {
  transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.wallpaper::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--panel-bg) 0%, rgba(8,15,35,0.45) 40%, rgba(8,15,35,0.6) 100%);
  backdrop-filter: blur(2px);
}

.stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }

.snowflakes { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.snowflake { position: absolute; color: rgba(255,255,255,0.75); font-size: 14px; animation: snowfall linear infinite; text-shadow: 0 0 4px rgba(255,255,255,0.5); }

.header { display: flex; align-items: center; gap: 14px; padding: 22px 30px 14px; position: relative; z-index: 3; animation: fadeIn 0.6s ease; }
.header .logo-wrap { width: 46px; height: 46px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(16px); box-shadow: var(--shadow), 0 0 20px var(--accent-soft); animation: float 3s ease-in-out infinite; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 1px; text-shadow: 0 2px 12px var(--field-bg); white-space: nowrap; flex-shrink: 0; }
.header h1 span { color: var(--accent2); font-weight: 400; }
.header .sub { font-size: 12px; color: var(--text-dim); margin-left: 10px; letter-spacing: 0.5px; min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header .spacer { flex: 1; }

<script>
/* 基础：HTML 转义、背景装饰（星空/雪花） */
// HTML 转义：所有来自后端/第三方（闲鱼标题、卖家昵称、商品描述、异常信息）
// 的文本在拼入 innerHTML 前必须过这里，否则卖家昵称可注入脚本，
// 配合暴露给 JS 的 pywebview.api.open_file 可执行本机任意程序。
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 星空
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 55 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.animationDuration = (2 + Math.random() * 3) + 's';
  starsContainer.appendChild(star);
}

// 雪花
const snowContainer = document.getElementById('snowflakes');
for (let i = 0; i < 30; i++) {
  const flake = document.createElement('div');
  flake.className = 'snowflake';
  flake.textContent = Math.random() > 0.5 ? '' : '';
  flake.style.left = Math.random() * 100 + '%';
  flake.style.animationDuration = (6 + Math.random() * 10) + 's';
  flake.style.animationDelay = Math.random() * 12 + 's';
  flake.style.fontSize = (10 + Math.random() * 12) + 'px';
  flake.style.opacity = 0.4 + Math.random() * 0.5;
  snowContainer.appendChild(flake);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runTool();
});
/* 模型配置：API Key 表单、预设联动、保存与测试 */

// === API Key 配置 ===
let _keyConfigured = null;   // null=未知 / true / false

function updateKeyBtn(status) {
  const btn = document.getElementById('keyBtn');
  const txt = document.getElementById('keyBtnText');
  if (!btn || !txt) return;
  if (status && status.configured) {
    txt.textContent = 'Key 已配置';
    btn.style.color = 'var(--success)';
    btn.title = 'API Key 已配置，点击可修改';
  } else {
    txt.textContent = 'Key 未配置';
    btn.style.color = 'var(--warn)';
    btn.title = '点击填写 API Key';
  }
}

let _llmInfo = null;   // 后端返回的配置与预设

function showKeyModal(fromStartup) {
  // 骨架交给 Modal 工厂 + .modal-* 样式类，
  // 这里只保留 Key 配置特有的字段，不再内联一大段 style
  const body = `
    <div class="modal-field">
      <div class="modal-label">服务商</div>
      <select id="keyPreset" class="modal-select" onchange="onPresetChange()"></select>
      <div id="keyPresetHint" class="modal-note"></div>
    </div>

    <div class="modal-field">
      <div class="modal-label">API Key <span id="keyApplyLink" class="modal-link" onclick="openKeyPage()">去申请 →</span></div>
      <input type="password" id="keyInput" class="modal-input mono" placeholder="在这里粘贴 API Key" />
    </div>

    <div class="modal-row">
      <label class="modal-check"><input type="checkbox" id="keyShow" onclick="toggleKeyVisible()" />显示明文</label>
      <label class="modal-check"><input type="checkbox" id="keyAdvanced" onclick="toggleAdvanced()" />高级：文本/视觉分开配</label>
    </div>

    <div id="keyAdvancedArea" class="modal-section" style="display:none;">
      <div class="modal-section-title"><svg class="ico"><use href="#i-pen"/></svg>文本模型（写文案）</div>
      <div class="modal-grid2" style="margin-bottom:8px;">
        <input type="text" id="textBaseUrl" class="modal-input mono" placeholder="API 地址" />
        <input type="text" id="textModel" class="modal-input mono" placeholder="模型名" />
      </div>
      <input type="password" id="textKey" class="modal-input mono" placeholder="独立 Key（留空则用上面的 Key）" style="margin-bottom:8px;" />
      <button class="modal-btn" id="testTextBtn" onclick="testModel('text')" style="padding:6px 14px;font-size:12px;">测试文本模型</button>

      <div class="modal-section-title" style="margin-top:14px;"><svg class="ico"><use href="#i-image"/></svg>视觉模型（去水印，必须支持图片）</div>
      <div class="modal-grid2" style="margin-bottom:8px;">
        <input type="text" id="visionBaseUrl" class="modal-input mono" placeholder="API 地址" />
        <input type="text" id="visionModel" class="modal-input mono" placeholder="模型名" />
      </div>
      <input type="password" id="visionKey" class="modal-input mono" placeholder="独立 Key（留空则用上面的 Key）" style="margin-bottom:8px;" />
      <button class="modal-btn" id="testVisionBtn" onclick="testModel('vision')" style="padding:6px 14px;font-size:12px;">测试视觉模型</button>

      <p class="modal-note">提示：DeepSeek 等纯文本服务不能做视觉模型，去水印需另外配一个支持图片的（如智谱 glm-4v-flash、魔搭 Qwen2-VL）。地址末尾不要带斜杠。</p>
    </div>

    <p id="keyHint" class="modal-hint"></p>
  `;

  Modal.open({
    id: 'keyOverlay',
    icon: 'i-key',
    title: '配置大模型',
    desc: '本工具不内置 Key，需要填你自己的',
    body: body,
    wide: true,
    actions: [
      { text: '稍后配置', onclick: () => Modal.close('keyOverlay') },
      { text: '保存并验证', primary: true, id: 'keySaveBtn', onclick: saveKey },
    ],
    footer: '配置只存在本机，不会上传 · <span class="modal-link" onclick="showConfigExport()">备份配置</span> · <span class="modal-link" onclick="showConfigImport()">恢复配置</span>',
  });

  loadLlmConfig(fromStartup);
}

function loadLlmConfig(fromStartup) {
  pywebview.api.get_llm_config().then(info => {
    _llmInfo = info;
    if (!info || !info.success) {
      setKeyHint('读取配置失败：' + (info && info.error || '未知'), 'error');
      return;
    }

    // 填充服务商下拉
    const sel = document.getElementById('keyPreset');
    sel.innerHTML = '';
    Object.keys(info.presets).forEach(k => {
      const p = info.presets[k];
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = p.label;
      sel.appendChild(opt);
    });

    // 判断当前该选哪个预设
    const cur = info.text.provider || 'zhipu';
    sel.value = Object.prototype.hasOwnProperty.call(info.presets, cur) ? cur : 'custom';

    // 已配置的 key 回填（显示在输入框，方便直接保存）
    if (info.text.api_key) {
      document.getElementById('keyInput').value = info.text.api_key;
    }
    applyPresetValues(sel.value, info);

    if (fromStartup) {
      setKeyHint('首次使用需要配置，填好 Key 即可开始处理商品', 'warn');
    }
  }).catch(e => setKeyHint('读取配置异常：' + e, 'error'));
}

function applyPresetValues(presetKey, info) {
  info = info || _llmInfo;
  if (!info) return;
  const p = info.presets[presetKey];
  if (!p) return;

  const hintEl = document.getElementById('keyPresetHint');
  if (hintEl) hintEl.textContent = p.hint || '';

  const linkEl = document.getElementById('keyApplyLink');
  if (linkEl) linkEl.style.display = p.apply_url ? 'inline' : 'none';

  // 只在对应用户还没手填时覆盖，避免把已保存的自定义值冲掉
  const tb = document.getElementById('textBaseUrl');
  const tm = document.getElementById('textModel');
  const vb = document.getElementById('visionBaseUrl');
  const vm = document.getElementById('visionModel');

  if (presetKey === 'custom') {
    if (!tb.value) tb.value = info.text.base_url || '';
    if (!tm.value) tm.value = info.text.model || '';
    if (!vb.value) vb.value = info.vision.base_url || '';
    if (!vm.value) vm.value = info.vision.model || '';
  } else {
    if (tb) tb.value = p.base_url;
    if (tm) tm.value = p.text_model;
    if (vb) vb.value = p.base_url;
    if (vm) vm.value = p.vision_model;
  }
}

function onPresetChange() {
  const sel = document.getElementById('keyPreset');
  applyPresetValues(sel.value);
}

function toggleAdvanced() {
  const cb = document.getElementById('keyAdvanced');
  const area = document.getElementById('keyAdvancedArea');
  if (!cb || !area) return;
  area.style.display = cb.checked ? 'block' : 'none';
  if (cb.checked) {
    // 用当前选中的预设填充，而不是用已保存的旧配置，
    // 否则用户先选 DeepSeek 再勾"高级"，输入框会被旧值冲掉
    const sel = document.getElementById('keyPreset');
    applyPresetValues(sel ? sel.value : 'zhipu');
  }
}

function setKeyHint(msg, level) {
  const el = document.getElementById('keyHint');
  if (!el) return;
  el.textContent = msg;
  el.style.color = level === 'error' ? 'var(--error)'
    : level === 'success' ? 'var(--success)'
    : level === 'warn' ? 'var(--warn)'
    : 'var(--text-dim)';
}

function hideKeyModal() {
  const ov = document.getElementById('keyOverlay');
  if (ov) ov.remove();
}

function toggleKeyVisible() {
  const cb = document.getElementById('keyShow');
  const inp = document.getElementById('keyInput');
  if (cb && inp) inp.type = cb.checked ? 'text' : 'password';
}

function openKeyPage() {
  const sel = document.getElementById('keyPreset');
  const key = sel ? sel.value : 'zhipu';
  const p = (_llmInfo && _llmInfo.presets) ? _llmInfo.presets[key] : null;
  pywebview.api.open_url((p && p.apply_url) || 'https://open.bigmodel.cn/');
}

// 从界面收集某一类模型的配置
function collectSection(kind, fallbackKey) {
  const presetEl = document.getElementById('keyPreset');
  const preset = presetEl ? presetEl.value : 'zhipu';
  if (kind === 'text') {
    return {
      provider: preset,
      base_url: (document.getElementById('textBaseUrl').value || '').trim(),
      model: (document.getElementById('textModel').value || '').trim(),
      api_key: (document.getElementById('textKey').value || '').trim() || fallbackKey,
    };
  }
  return {
    provider: preset,
    base_url: (document.getElementById('visionBaseUrl').value || '').trim(),
    model: (document.getElementById('visionModel').value || '').trim(),
    api_key: (document.getElementById('visionKey').value || '').trim() || fallbackKey,
  };
}

// 把当前界面上的配置组装成 text / vision 两组
function buildSections() {
  const key = (document.getElementById('keyInput').value || '').trim();
  const advEl = document.getElementById('keyAdvanced');
  const adv = advEl && advEl.checked;
  const presetEl = document.getElementById('keyPreset');
  const preset = presetEl ? presetEl.value : 'zhipu';

  if (adv) {
    return { key: key, text: collectSection('text', key), vision: collectSection('vision', key), adv: true };
  }

  const p = (_llmInfo && _llmInfo.presets) ? _llmInfo.presets[preset] : null;
  if (!p) return { key: key, text: null, vision: null, adv: false };

  const text = { provider: preset, base_url: p.base_url, model: p.text_model, api_key: key };
  let vision;
  if (p.vision_ok && p.vision_model) {
    vision = { provider: preset, base_url: p.base_url, model: p.vision_model, api_key: key };
  } else {
    // 该服务没有视觉能力（如 DeepSeek），视觉留空，去水印会提示未配置
    vision = { provider: 'zhipu', base_url: '', model: '', api_key: '' };
  }
  return { key: key, text: text, vision: vision, adv: false };
}

function saveKey() {
  const btn = document.getElementById('keySaveBtn');
  const built = buildSections();

  if (!built.key) {
    setKeyHint('请先粘贴 API Key', 'error');
    return;
  }
  if (!built.text) {
    setKeyHint('配置异常，请关闭重开', 'error');
    return;
  }
  if (built.adv && !built.vision.model) {
    setKeyHint('视觉模型缺模型名。去水印必须要一个支持图片的模型', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '保存中…';
  setKeyHint('正在保存…');

  pywebview.api.save_llm_config(built.text, built.vision).then(r => {
    if (!r.success) {
      setKeyHint(r.error || '保存失败', 'error');
      btn.disabled = false;
      btn.textContent = '保存并验证';
      return;
    }

    setKeyHint('已保存，正在验证文本模型…');
    pywebview.api.test_llm('text').then(t => {
      if (!t.success) {
        _keyConfigured = true;
        updateKeyBtn({ configured: true });
        btn.disabled = false;
        btn.textContent = '保存并验证';
        setKeyHint('已保存，但文本模型验证失败：' + (t.error || ''), 'warn');
        return;
      }
      if (!r.vision_ready) {
        finishSave(true, '视觉模型未配置，去水印功能不可用');
        return;
      }
      setKeyHint('文本模型 <svg class="ico"><use href="#i-check"/></svg>，正在验证视觉模型…', 'success');
      pywebview.api.test_llm('vision').then(v => {
        finishSave(v.success, v.success ? '' : (v.error || ''));
      }).catch(e => finishSave(false, String(e)));
    }).catch(e => {
      btn.disabled = false;
      btn.textContent = '保存并验证';
      setKeyHint('验证异常：' + e, 'warn');
    });
  }).catch(e => {
    btn.disabled = false;
    btn.textContent = '保存并验证';
    setKeyHint('保存异常：' + e, 'error');
  });
}

function finishSave(visionOk, visionMsg) {
  const btn = document.getElementById('keySaveBtn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = '保存并验证';
  }
  _keyConfigured = true;
  updateKeyBtn({ configured: true });

  if (visionOk) {
    setKeyHint('<svg class="ico"><use href="#i-check"/></svg> 全部验证通过，可以开始用了', 'success');
  } else {
    setKeyHint('文本模型可用；' + (visionMsg || '视觉模型未通过验证') + '（去水印会不可用）', 'warn');
  }
  addLog('大模型配置已保存', 'success');
  setTimeout(() => {
    hideKeyModal();
    if (!guideSeenBefore()) showGuide();
  }, 1100);
}

// 单独测试某一类模型（先用当前界面值静默保存，再测）
function testModel(kind) {
  const btnId = kind === 'text' ? 'testTextBtn' : 'testVisionBtn';
  const btn = document.getElementById(btnId);
  const built = buildSections();
  if (!built.key) {
    setKeyHint('请先填 API Key', 'error');
    return;
  }
  if (!built.text) return;

  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '测试中…';
  setKeyHint('正在保存当前配置…');

  pywebview.api.save_llm_config(built.text, built.vision).then(r => {
    if (!r.success) {
      btn.disabled = false;
      btn.textContent = oldText;
      setKeyHint(r.error || '保存失败', 'error');
      return;
    }
    setKeyHint('配置已保存，正在测试…');
    pywebview.api.test_llm(kind).then(t => {
      btn.disabled = false;
      btn.textContent = oldText;
      if (t.success) {
        setKeyHint((kind === 'text' ? '文本' : '视觉') + '模型 <svg class="ico"><use href="#i-check"/></svg> 回复：' + (t.reply || '正常'), 'success');
      } else {
        setKeyHint((kind === 'text' ? '文本' : '视觉') + '模型 <svg class="ico"><use href="#i-x"/></svg> ' + (t.error || '失败'), 'error');
      }
    }).catch(e => {
      btn.disabled = false;
      btn.textContent = oldText;
      setKeyHint('测试异常：' + e, 'error');
    });
  }).catch(e => {
    btn.disabled = false;
    btn.textContent = oldText;
    setKeyHint('保存异常：' + e, 'error');
  });
}
/* 界面基础：弹窗工厂、界面状态、三主题切换 */
// ===== 弹窗工厂 =====
// 统一弹窗骨架：图标 / 标题 / 描述 / 主体 / 提示 / 按钮组 / 底部说明。
// 各弹窗只写自己的业务字段，不再复制一整套内联样式。
const Modal = {
  open(opt) {
    this.close(opt.id);
    const overlay = document.createElement('div');
    overlay.id = opt.id;
    overlay.className = 'modal-overlay';

    const iconHtml = opt.icon
      ? '<div class="modal-icon"><svg class="ico"><use href="#' + opt.icon + '"/></svg></div>' : '';
    const titleHtml = opt.title ? '<h2 class="modal-title">' + opt.title + '</h2>' : '';
    const descHtml = opt.desc ? '<p class="modal-desc">' + opt.desc + '</p>' : '';
    const footHtml = opt.footer ? '<p class="modal-foot">' + opt.footer + '</p>' : '';

    let actionsHtml = '';
    if (opt.actions && opt.actions.length) {
      actionsHtml = '<div class="modal-actions">' + opt.actions.map((a, i) => {
        const cls = 'modal-btn' + (a.primary ? ' primary' : '');
        const attr = a.id ? ' id="' + a.id + '"' : '';
        return '<button class="' + cls + '"' + attr + ' data-action="' + i + '">' + a.text + '</button>';
      }).join('') + '</div>';
    }

    overlay.innerHTML =
      '<div class="modal-card' + (opt.wide ? ' modal-wide' : '') + '">' +
        iconHtml + titleHtml + descHtml + (opt.body || '') + actionsHtml + footHtml +
      '</div>';
    document.body.appendChild(overlay);

    (opt.actions || []).forEach((a, i) => {
      if (typeof a.onclick !== 'function') return;
      const btn = overlay.querySelector('[data-action="' + i + '"]');
      if (btn) btn.addEventListener('click', () => a.onclick());
    });
    return overlay;
  },

  close(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  },

  exists(id) {
    return !!document.getElementById(id);
  },
};

// 统一提示样式（替代各处手写 style.color）
function setHint(el, msg, level) {
  const node = typeof el === 'string' ? document.getElementById(el) : el;
  if (!node) return;
  node.textContent = msg;
  node.className = 'modal-hint' + (level ? ' ' + level : '');
}


// 注意：pywebview 用 html= 直接渲染时页面是 about:blank，
// localStorage 与 sessionStorage 都会抛 SecurityError，
// 所以状态必须存到后端文件（%LOCALAPPDATA%\XianyuTool\ui_state.json）。
let _uiState = { guide_seen: false, theme: 'system', skip_version: '' };

function loadUiState() {
  return pywebview.api.get_ui_state().then(st => {
    if (st && typeof st === 'object') _uiState = st;
    return _uiState;
  }).catch(() => _uiState);
}

function patchUiState(patch) {
  Object.assign(_uiState, patch);
  try {
    pywebview.api.save_ui_state(patch).catch(() => {});
  } catch (e) {}
}

function guideSeenBefore() { return !!_uiState.guide_seen; }

// ===== 主题：system / dark / light =====
let _systemTheme = 'dark';

function applyTheme(mode) {
  const root = document.documentElement;
  const actual = (mode === 'system') ? _systemTheme : mode;
  root.setAttribute('data-theme', actual === 'light' ? 'light' : 'dark');
  root.setAttribute('data-theme-mode', mode);

  const use = document.getElementById('themeUse');
  const btn = document.getElementById('themeBtn');
  const iconMap = { system: '#i-monitor', dark: '#i-moon', light: '#i-sun' };
  const labelMap = { system: '跟随系统', dark: '深色', light: '浅色' };
  if (use) use.setAttribute('href', iconMap[mode] || '#i-monitor');
  if (btn) btn.title = '当前：' + (labelMap[mode] || '跟随系统') + '（点击切换）';
}

function setTheme(mode) {
  applyTheme(mode);
  patchUiState({ theme: mode });
}

function cycleTheme() {
  const order = ['system', 'dark', 'light'];
  const cur = order.indexOf(_uiState.theme) === -1 ? 'system' : _uiState.theme;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  setTheme(next);
  addLog('主题已切换为「' + ({ system: '跟随系统', dark: '深色', light: '浅色' })[next] + '」', 'accent');
}

// 系统主题变化时，若处于跟随模式则实时同步
(function watchSystemTheme() {
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = (e) => {
      _systemTheme = e.matches ? 'light' : 'dark';
      if ((_uiState.theme || 'system') === 'system') applyTheme('system');
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) {}
})();

window.addEventListener('pywebviewready', () => {
  loadUiState().then(() => {
    // 系统主题以注册表为准（WebView2 的 prefers-color-scheme 不一定跟随系统）
    return pywebview.api.get_system_theme().catch(() => null);
  }).then(sys => {
    if (sys && sys.theme) _systemTheme = sys.theme;
    applyTheme(_uiState.theme || 'system');
    return pywebview.api.get_key_status();
  }).then(s => {
    _keyConfigured = !!(s && s.configured);
    updateKeyBtn(s);
    if (!_keyConfigured) {
      setTimeout(() => showKeyModal(true), 400);
    } else if (!guideSeenBefore()) {
      setTimeout(() => showGuide(), 800);
    }
  }).catch(() => {
    applyTheme(_uiState.theme || 'system');
    _keyConfigured = null;
    if (!guideSeenBefore()) {
      setTimeout(() => showGuide(), 800);
    }
  });
});
/* 批量队列：入队、轮询、列表渲染 */
// ===== 批量队列 =====
// 串行执行，界面每 1.5 秒轮询一次状态；离开该 tab 时停止轮询省资源。
let _queueTimer = null;

function startQueuePolling() {
  if (_queueTimer) return;
  _queueTimer = setInterval(refreshQueue, 1500);
}

function stopQueuePolling() {
  if (_queueTimer) { clearInterval(_queueTimer); _queueTimer = null; }
}

function queueAdd() {
  const ta = document.getElementById('queueText');
  const text = ta ? ta.value : '';
  if (!text.trim()) { addLog('请先粘贴链接', 'warn'); return; }
  pywebview.api.queue_add(text).then(function (r) {
    if (!r || !r.success) { addLog((r && r.error) || '入队失败', 'error'); return; }
    let msg = '已加入 ' + r.added + ' 条';
    if (r.skipped) msg += '，跳过 ' + r.skipped + ' 条（重复或非链接）';
    msg += '，队列共 ' + r.total + ' 条';
    addLog(msg, 'success');
    if (ta) ta.value = '';
    refreshQueue();
  }).catch(function (e) { addLog('入队异常：' + e, 'error'); });
}

function queueStart() {
  const maxEl = document.getElementById('searchMax');
  const maxImgs = maxEl ? (parseInt(maxEl.value, 10) || 15) : 15;
  pywebview.api.queue_start(maxImgs).then(function (r) {
    if (!r || !r.success) { addLog((r && r.error) || '启动失败', 'error'); return; }
    addLog('批量处理已开始：串行执行，每条之间自动间隔几秒', 'accent');
    startQueuePolling();
  }).catch(function (e) { addLog('启动异常：' + e, 'error'); });
}

function queueStop() {
  pywebview.api.queue_stop().then(function () {
    addLog('已请求停止：当前这条跑完后不再开始新的', 'warn');
  }).catch(function () {});
}

function queueClear() {
  pywebview.api.queue_clear().then(function () { refreshQueue(); }).catch(function () {});
}

function refreshQueue() {
  pywebview.api.queue_status().then(function (s) {
    if (!s || !s.success) return;
    renderQueue(s);
    if (s.active) startQueuePolling();
    else stopQueuePolling();
  }).catch(function () {});
}

const QUEUE_ICON = {
  pending: '#i-link',
  running: '#i-loader',
  done: '#i-check',
  failed: '#i-x'
};
const QUEUE_LABEL = {
  pending: '排队中',
  running: '处理中',
  done: '已完成',
  failed: '失败'
};

function renderQueue(s) {
  const sum = document.getElementById('queueSummary');
  if (sum) {
    if (!s.total) {
      sum.textContent = '队列为空，先粘贴链接再点「加入队列」';
    } else {
      const finished = (s.done || 0) + (s.failed || 0);
      const pct = Math.round(finished / s.total * 100);
      let stats = '<span>共 ' + s.total + ' 条</span>';
      stats += '<span>已处理 ' + finished + '/' + s.total + '</span>';
      if (s.done) stats += '<span class="qs-ok">成功 ' + s.done + '</span>';
      if (s.failed) stats += '<span class="qs-fail">失败 ' + s.failed + '</span>';
      if (s.running) stats += '<span class="qs-run">进行中 ' + s.running + '</span>';
      if (s.pending) stats += '<span>等待 ' + s.pending + '</span>';
      if (s.single_running) stats += '<span class="qs-run">单条任务占用中</span>';
      sum.innerHTML =
        '<div class="queue-progress"><div class="queue-progress-bar" style="width:' + pct + '%"></div></div>' +
        '<div class="queue-stats">' + stats + '</div>';
    }
  }

  const list = document.getElementById('queueList');
  if (!list) return;
  if (!s.total) { list.innerHTML = ''; return; }

  list.innerHTML = (s.tasks || []).map(function (t) {
    const st = t.status || 'pending';
    let sub;
    if (st === 'done') {
      sub = (t.title || '') + (t.elapsed ? ' · ' + t.elapsed + 's' : '');
    } else if (st === 'failed') {
      sub = (t.stage ? t.stage + '：' : '') + (t.error || '未知错误');
    } else if (st === 'running') {
      sub = t.stage || '处理中…';
    } else {
      sub = t.url;
    }
    const titleText = t.title || QUEUE_LABEL[st] || t.url || '';
    const iconCls = st === 'running' ? ' spin-ico' : '';
    const openBtn = (st === 'done' && t.output_dir)
      ? '<button class="qi-btn" data-dir="' + escapeHtml(t.output_dir) + '" onclick="queueOpen(this.dataset.dir)">打开</button>'
      : '';
    return '<div class="queue-item ' + st + '">' +
      '<span class="qi-ico"><svg class="ico' + iconCls + '"><use href="' + (QUEUE_ICON[st] || '#i-link') + '"/></svg></span>' +
      '<div class="qi-main">' +
        '<div class="qi-title">' + escapeHtml(titleText) + '</div>' +
        '<div class="qi-sub">' + escapeHtml(sub) + '</div>' +
      '</div>' + openBtn +
    '</div>';
  }).join('');
}

function queueOpen(dir) {
  pywebview.api.queue_open_output(dir).then(function (r) {
    if (!r || !r.success) addLog((r && r.error) || '打开目录失败', 'error');
  }).catch(function () {});
}


function queueRetryFailed() {
  pywebview.api.queue_retry_failed().then(function (r) {
    if (!r || !r.success) {
      addLog((r && r.error) || '重试失败', 'warn');
      return;
    }
    addLog('已把 ' + r.count + ' 条失败任务放回队列，点「开始处理」继续', 'success');
    refreshQueue();
  }).catch(function (e) { addLog('重试异常：' + e, 'error'); });
}

function showConfigExport() {
  Modal.open({

/* 历史记录：列出处理过的商品，可重新加载到界面查看
   数据来自 %TEMP%\xianyu_tool\output\{商品ID}\result.json */

function showHistoryModal() {
  Modal.open({
    id: 'historyOverlay',
    icon: 'i-grid',
    title: '历史记录',
    desc: '处理过的商品都保留在本机，可随时重新查看',
    wide: true,
    body: '<div id="historyList" class="history-list">' +
            '<p class="modal-note" style="text-align:center;">读取中…</p>' +
          '</div>',
    actions: [
      { text: '刷新', onclick: loadHistory },
      { text: '关闭', onclick: function () { Modal.close('historyOverlay'); } },
    ],

  });
  loadHistory();

function loadHistory() {
  const box = document.getElementById('historyList');
  if (!box) return;
  pywebview.api.list_history(50).then(function (r) {
    if (!r || !r.success) {
      box.innerHTML = '<p class="modal-note" style="text-align:center;color:var(--error);">' +
        escapeHtml((r && r.error) || '读取失败') + '</p>';
      return;
    }
    if (!r.items || !r.items.length) {
      box.innerHTML = '<p class="modal-note" style="text-align:center;">还没有处理记录，先在上方粘贴链接跑一条</p>';
      return;
    }
    window._historyItems = r.items;
    box.innerHTML = r.items.map(function (it, i) {
      const meta = [
        it.price ? '¥' + it.price : '',
        it.images + ' 张图',
        it.has_copies ? '含文案' : '无文案',
        it.mtime_text,
      ].filter(Boolean).join(' · ');
      return '<div class="history-item">' +
        '<div class="hi-main">' +
          '<div class="hi-title">' + escapeHtml(it.title) + '</div>' +
          '<div class="hi-meta">' + escapeHtml(meta) + '</div>' +
        '</div>' +
        '<button class="hi-btn" data-i="' + i + '" onclick="loadHistoryItem(this.dataset.i)">加载</button>' +
        '<button class="hi-btn" data-dir="' + escapeHtml(it.output_dir) + '" onclick="openHistoryDir(this.dataset.dir)">目录</button>' +
        '<button class="hi-btn hi-btn-del" data-i="' + i + '" onclick="deleteHistoryItem(this.dataset.i)" title="删除这条记录">删</button>' +
      '</div>';
    }).join('');
  }).catch(function (e) {
    box.innerHTML = '<p class="modal-note" style="text-align:center;color:var(--error);">读取异常：' +
      escapeHtml(String(e)) + '</p>';
  });
}

function loadHistoryItem(idx) {
  const items = window._historyItems || [];
  const it = items[parseInt(idx, 10)];
  if (!it) return;

  _outputDir = it.output_dir;

  const pane0 = document.getElementById('pane0');

    pane0.innerHTML =
      '<div class="info-card">' +
        '<div class="info-row"><span class="label">标题</span><span class="value">' + escapeHtml(it.title) + '</span></div>' +
        '<div class="info-row"><span class="label">价格</span><span class="value">' + escapeHtml(it.price || '-') + '</span></div>' +

        '<div class="info-row"><span class="label">商品ID</span><span class="value">' + escapeHtml(it.product_id) + '</span></div>' +
      '</div>' +
      '<div class="info-desc">' + escapeHtml(it.desc || '(无描述)') + '</div>';
  }

// === 首次使用引导 ===
function showGuide() {
  // 引导需要按步骤重绘，不适合静态的 Modal 工厂，
  // 因此复用同一套 .modal-* 样式类，去掉内联样式。
  const overlay = document.createElement('div');
  overlay.id = 'guideOverlay';
  overlay.className = 'modal-overlay';
  overlay.style.zIndex = '9999';

  const steps = [
    { icon: 'i-fish', title: '欢迎使用闲鱼辅助工具', desc: '帮你一键解析闲鱼商品、去水印、生成三版文案、搜补充图' },
    { icon: 'i-link', title: '第一步：粘贴链接', desc: '把闲鱼商品分享链接粘贴到顶部输入框，点「开始」' },
    { icon: 'i-key', title: '第二步：首次需扫码登录', desc: '首次使用会弹出浏览器窗口，扫码登录闲鱼即可，之后自动记住登录态' },
    { icon: 'i-sparkle', title: '第三步：等待处理完成', desc: '自动解析商品 → 下载图片 → 去水印 → 生成三版文案，约 1-2 分钟' },
    { icon: 'i-download', title: '第四步：保存结果', desc: '图片、文案、补充图都可以一键保存到你选的位置' },
    { icon: 'i-info', title: '遇到问题？', desc: '点击底部的「问题反馈」按钮描述你遇到的问题' },
  ];

  let currentStep = 0;

  function renderStep() {
    const step = steps[currentStep];
    const isLast = currentStep === steps.length - 1;
    const isFirst = currentStep === 0;

    const dots = steps.map((_, i) =>
      '<span class="guide-dot' + (i === currentStep ? ' active' : '') + '"></span>'
    ).join('');

    let actions = '';
    if (!isFirst) actions += '<button class="modal-btn" data-guide="prev">上一步</button>';
    actions += isLast
      ? '<button class="modal-btn primary" data-guide="done"><svg class="ico"><use href="#i-check"/></svg>开始使用</button>'
      : '<button class="modal-btn primary" data-guide="next">下一步</button>';

    overlay.innerHTML =
      '<div class="modal-card" style="text-align:center;padding:34px 32px;">' +
        '<div class="modal-icon"><svg class="ico" style="width:44px;height:44px;"><use href="#' + step.icon + '"/></svg></div>' +
        '<h2 class="modal-title">' + step.title + '</h2>' +
        '<p class="modal-desc" style="margin-bottom:24px;">' + step.desc + '</p>' +
        '<div class="guide-dots">' + dots + '</div>' +
        '<div class="modal-actions">' + actions + '</div>' +
        (isFirst ? '<p class="modal-foot" style="cursor:pointer;margin-top:14px;" data-guide="skip">跳过引导</p>' : '') +
      '</div>';

    overlay.querySelectorAll('[data-guide]').forEach(function (el) {
      el.addEventListener('click', function () {
        const act = el.getAttribute('data-guide');
        if (act === 'next') { currentStep++; renderStep(); }
        else if (act === 'prev') { currentStep--; renderStep(); }
        else { closeGuide(); }
      });
    });
  }

  function closeGuide() {
    const ov = document.getElementById('guideOverlay');
    if (ov) ov.remove();
    patchUiState({ guide_seen: true });
  }

  window.guideNext = function () { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } };
  window.guidePrev = function () { if (currentStep > 0) { currentStep--; renderStep(); } };
  window.closeGuide = closeGuide;

  renderStep();
  document.body.appendChild(overlay);
}

/* 主流程：链接处理、图片与文案渲染、标签切换、更新检查 */
let _outputDir = null;
let _copiesData = null;

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-pane').forEach((p, i) => p.classList.toggle('active', i === idx));
  // 批量 tab：进入时立即刷新并在运行中开启轮询；离开时停掉，省资源
  if (idx === 6) {
    refreshQueue();
  } else {
    stopQueuePolling();
  }
}

function addLog(msg, type) {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = 'log-line' + (type ? ' ' + type : '');
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function clearLog() { document.getElementById('logBox').innerHTML = ''; }
function setStatus(msg, state) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusDot').className = 'status-dot' + (state ? ' ' + state : '');
}
function setProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }
function setBtnLoading(loading) {
  const btn = document.getElementById('runBtn');
  btn.classList.toggle('loading', loading);
  btn.disabled = loading;
  btn.querySelector('.btn-text').textContent = loading ? '运行中...' : '开始';
}

function runTool() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { setStatus('请输入链接！', 'error'); return; }

  // 没有 Key 就先拦住，别让用户白等一轮
  if (_keyConfigured === false) {
    setStatus('请先配置 API Key', 'error');
    addLog('还没有配置 API Key，先填一下再开始', 'error');
    showKeyModal(true);
    return;
  }

  // 简单链接验证
  if (!url.match(/https?:\/\/[\w\.-]+/i)) {
    setStatus('链接格式不正确，请粘贴闲鱼分享链接', 'error');
    addLog('链接格式不正确', 'error');
    return;
  }

  const searchMax = parseInt(document.getElementById('searchMax').value) || 15;

  clearLog();
  addLog('开始处理，和小新小白一起漫步吧~', 'accent');
  setStatus('正在启动浏览器...', 'running');
  setProgress(5);
  setBtnLoading(true);

  // 进度模拟（实际进度由各阶段回调驱动）
  let fakeProgress = 5;
  const progressTimer = setInterval(() => {
    if (fakeProgress < 90) {
      fakeProgress += 1;
      setProgress(fakeProgress);
      if (fakeProgress === 15) setStatus('解析闲鱼链接...', 'running');
      if (fakeProgress === 30) setStatus('下载商品图片...', 'running');
      if (fakeProgress === 50) setStatus('去水印 + 生成文案...', 'running');
      if (fakeProgress === 80) setStatus('整理结果...', 'running');
    }
  }, 800);

  for (let i = 0; i < 6; i++) {
    document.getElementById('pane' + i).innerHTML = '<div class="empty"><span class="emoji spinning"></span><p>处理中，请稍候...</p></div>';
  }

  pywebview.api.run_tool(url, searchMax).then(result => {
    clearInterval(progressTimer);
    setBtnLoading(false);
    if (result && result.success) {
      setProgress(100);
      addLog('全流程完成！耗时 ' + result.elapsed + '秒', 'success');
      setStatus('完成！耗时 ' + result.elapsed + '秒', 'done');
      displayResult(result);
    } else {
      const errMsg = (result && result.error) ? result.error : '未知错误，请检查链接是否有效';
      addLog('处理失败: ' + errMsg, 'error');
      setStatus('失败: ' + errMsg.substring(0, 30), 'error');
      setProgress(0);
    }
  }).catch(err => {
    clearInterval(progressTimer);
    setBtnLoading(false);
    const errMsg = String(err).substring(0, 100);
    addLog('错误: ' + errMsg, 'error');
    setStatus('运行出错', 'error');
    setProgress(0);
  });
}

function displayResult(result) {
  _outputDir = result.output_dir;

  // 商品信息 + 耗时
  let html = '<div class="info-card">';
  const info = [
    ['标题', result.title],
    ['价格', '¥' + result.price],
    ['卖家', result.seller],
    ['商品ID', result.item_id],
    ['文案字数', result.desc_len + ' 字'],
  ];
  info.forEach(([label, value]) => {
    html += '<div class="info-row"><div class="label">' + escapeHtml(label) + '</div><div class="value">' + escapeHtml(value) + '</div></div>';
  });
  html += '</div>';
  if (result.desc) {
    html += '<div class="info-desc">' + escapeHtml(result.desc) + '</div>';
  }
  // 耗时面板
  if (result.timings) {
    const t = result.timings;
    // timings 里可能有非数字值（如文案超时写入的 "超时"），
    // 直接 Math.max 会得到 NaN，导致所有进度条宽度变成无效值
    const numeric = Object.values(t).filter(function (v) { return typeof v === 'number' && v > 0; });
    const maxT = numeric.length ? Math.max.apply(null, numeric) : 1;
    html += '<div class="timings"><h4><svg class="ico"><use href="#i-loader"/></svg> 各模块耗时</h4>';
    for (const [name, val] of Object.entries(t)) {
      const isNum = (typeof val === 'number');
      const pct = isNum ? Math.min(100, (val / maxT * 100)).toFixed(0) : 0;
      html += '<div class="timing-row"><span class="timing-name">' + escapeHtml(name) + '</span>' +
        '<div class="timing-bar"><div class="timing-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="timing-val">' + (isNum ? val + '秒' : escapeHtml(String(val))) + '</span></div>';
    }
    html += '</div>';
  }
  document.getElementById('pane0').innerHTML = html;

  // 原图
  pywebview.api.get_images(result.output_dir, 'original').then(imgs => {
    document.getElementById('pane1').innerHTML = renderImagesWithSave(imgs, 'original');
  });
  // 去水印
  pywebview.api.get_images(result.output_dir, 'clean').then(imgs => {
    document.getElementById('pane2').innerHTML = renderImagesWithSave(imgs, 'clean');
  });
  // 文案 - 先显示生成中，轮询检查状态
  document.getElementById('pane3').innerHTML = '<div class="empty"><span class="emoji spinning"><svg class="ico"><use href="#i-pen"/></svg></span><p>文案后台生成中，预计30-60秒...</p></div>';
  startCopyPolling(result.output_dir);
  // 补充图
  document.getElementById('pane4').innerHTML = '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-search"/></svg></span><p>点击下方按钮搜索补充图</p>' +
    '<button class="btn-refresh" id="searchSupplementBtn" onclick="searchSupplementImages()" style="margin-top:12px;"><svg class="ico"><use href="#i-search"/></svg> 搜索补充图</button></div>';
  // 视频
  if (result.video_url) {
    document.getElementById('pane5').innerHTML = '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-video"/></svg></span><p>该商品有视频</p>' +
      '<button class="btn-refresh" onclick="downloadVideo()" style="margin-top:12px;"><svg class="ico"><use href="#i-download"/></svg> 保存视频</button></div>';
  } else {
    document.getElementById('pane5').innerHTML = '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-video"/></svg></span><p>该商品没有视频</p></div>';
  }
}

  });
}

let _copyPollTimer = null;
function startCopyPolling(outputDir) {
  if (_copyPollTimer) clearInterval(_copyPollTimer);
  let pollCount = 0;
  _copyPollTimer = setInterval(() => {
    pollCount++;
    pywebview.api.check_copy_status(outputDir).then(data => {
      if (data && data.done === false) return; // 还没完成
      if (data && data.error) {
        clearInterval(_copyPollTimer);
        _copyPollTimer = null;
        document.getElementById('pane3').innerHTML = '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-pen"/></svg></span><p>文案生成失败: ' + escapeHtml(data.error) + '</p></div>';
        return;
      }
      if (data && data.versions && data.versions.length > 0) {
        clearInterval(_copyPollTimer);
        _copyPollTimer = null;
        _copiesData = data;
        document.getElementById('pane3').innerHTML = renderCopies(data);
        addLog('文案生成完成！V1/V2/V3已就绪', 'success');
      }
    });
    // 超时保护：5分钟
    if (pollCount > 100) {
      clearInterval(_copyPollTimer);
      _copyPollTimer = null;
      document.getElementById('pane3').innerHTML = '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-pen"/></svg></span><p>文案生成超时，请点击刷新重试</p></div>';
    }
  }, 3000); // 每3秒检查一次
}

function renderCopies(data) {
  if (!data.versions || data.versions.length === 0) return '<div class="empty"><span class="emoji"><svg class="ico"><use href="#i-pen"/></svg></span><p>无文案</p></div>';
  let html = '<div class="copy-tabs">';
  data.versions.forEach((v, i) => {
    html += '<div class="copy-tab' + (i === 0 ? ' active' : '') + '" onclick="switchCopy(' + i + ')" data-version="' + escapeHtml(v.key) + '">' +
      '<span>' + escapeHtml(v.label) + '</span><span class="refresh-icon" onclick="event.stopPropagation();refreshCopy(' + i + ')" title="重新生成"><svg class="ico"><use href="#i-refresh"/></svg></span></div>';
  });
  html += '</div><div id="copyBody"></div>';
  // V3自定义提示词区域
  html += '<div class="custom-prompt-area">';
  html += '<div class="cp-label"><svg class="ico"><use href="#i-info"/></svg> V3 自定义提示词（可选，不填则默认重写）</div>';
  html += '<div class="cp-row">';
  html += '<input type="text" id="v3CustomPrompt" class="cp-input" placeholder="例如：突出性价比，加上使用场景，语气活泼一点" />';
  html += '<button class="btn-refresh cp-btn" onclick="savePromptTemplate()"><svg class="ico"><use href="#i-download"/></svg> 存为模板</button>';
  html += '<button class="btn-refresh cp-btn" onclick="v3CustomRewrite()"><svg class="ico"><use href="#i-refresh"/></svg> 按提示词重写</button>';
  html += '</div>';
  html += '<div id="v3TplChips" class="cp-chips"></div>';
  html += '</div>';
  // 模板列表异步填充（每次渲染文案都会重建这块）
  setTimeout(loadPromptTemplates, 80);
  window._copies = data.versions;
  setTimeout(() => { switchCopy(0); }, 50);
  return html;
}

function switchCopy(idx) {
  document.querySelectorAll('.copy-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  const v = window._copies[idx];
  const badge = v.banned.length > 0
    ? '<span class="badge-warn"><svg class="ico"><use href="#i-alert"/></svg> 违禁词: ' + escapeHtml(v.banned.join(',')) + '</span>'
    : '<span class="badge-ok"><svg class="ico"><use href="#i-check"/></svg> 零违禁词</span>';
  document.getElementById('copyBody').innerHTML =
    '<div class="copy-meta"><span>' + v.text.length + '字</span>' + badge +
    '<button class="btn-copy" onclick="showCopyHistory(' + idx + ')" title="查看生成历史" style="margin-left:auto;padding:4px 12px;border-radius:6px;border:1px solid var(--glass-border);background:var(--glass-light);color:var(--text);cursor:pointer;font-size:12px;"><svg class="ico"><use href="#i-clock"/></svg> 历史</button>' +
    '<button class="btn-copy" onclick="copyText(' + idx + ')" style="margin-left:6px;padding:4px 12px;border-radius:6px;border:1px solid var(--glass-border);background:var(--glass-light);color:var(--text);cursor:pointer;font-size:12px;"><svg class="ico"><use href="#i-copy"/></svg> 一键复制</button></div>' +
    '<div class="copy-content" id="copyText_' + idx + '">' + escapeHtml(v.text) + '</div>';
}

function refreshCopy(idx) {
  if (!_outputDir || !window._copies) return;
  const v = window._copies[idx];
  const tab = document.querySelectorAll('.copy-tab')[idx];
  const refreshIcon = tab.querySelector('.refresh-icon');
  refreshIcon.innerHTML = '<svg class="ico spin-ico"><use href="#i-loader"/></svg>';

  addLog('重新生成 ' + v.label + '...', 'accent');

  pywebview.api.regenerate_copy(_outputDir, v.key).then(r => {
    if (r.success) {
      window._copies[idx].text = r.text;
      window._copies[idx].banned = r.banned;
      switchCopy(idx);
      addLog('' + v.label + ' 重新生成完成 (' + r.text.length + '字)', 'success');
    } else {
      addLog('重新生成失败: ' + r.error, 'error');
    }
    // 原实现用 textContent 塞 HTML 字符串，界面上会显示成标签源码
    refreshIcon.innerHTML = '<svg class="ico"><use href="#i-refresh"/></svg>';
  });
}

function copyText(idx) {
  if (!window._copies) return;
  const text = window._copies[idx].text;
  const title = window._copies[idx].label;
  // 用clipboard API
  navigator.clipboard.writeText(text).then(() => {
    addLog('已复制 ' + title + ' (' + text.length + '字)', 'success');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    addLog('已复制 ' + title, 'success');
  });
}

function v3CustomRewrite() {
  if (!_outputDir || !window._copies) return;
  const prompt = document.getElementById('v3CustomPrompt').value.trim();
  if (!prompt) {
    setStatus('请输入自定义提示词', 'error');
    return;
  }
  addLog('V3按自定义提示词重写...', 'accent');
  pywebview.api.regenerate_copy(_outputDir, 'v3', prompt).then(r => {
    if (r.success) {
      window._copies[2].text = r.text;
      window._copies[2].banned = r.banned;
      switchCopy(2);
      addLog('V3自定义重写完成 (' + r.text.length + '字)', 'success');
    } else {
      addLog('V3重写失败: ' + r.error, 'error');
    }
  });
}

function downloadVideo() {
  if (!_outputDir) return;
  addLog('<svg class="ico"><use href="#i-download"/></svg> 正在下载视频...', 'accent');
  pywebview.api.download_video(_outputDir).then(r => {
    if (r.success) {
      addLog('视频已保存: ' + r.path, 'success');

function searchSupplementImages() {

  const maxImg = parseInt(document.getElementById('searchMax').value) || 15;
  const btn = document.getElementById('searchSupplementBtn');

        document.getElementById('pane4').innerHTML = renderSearchImages(imgs);

      addLog('搜索失败: ' + r.error, 'error');
    }
  });
}

// === 检查更新 ===
let _updateChecking = false;

function checkUpdate(manual) {
  if (_updateChecking) return;
  _updateChecking = true;

  const btn = document.getElementById('updateBtn');
  const dot = document.getElementById('updateDot');
  const text = document.getElementById('updateBtnText');

  btn.classList.add('checking');
  dot.className = 'dot checking';
  text.textContent = '检查中...';

  pywebview.api.check_update().then(result => {
    btn.classList.remove('checking');
    _updateChecking = false;

    if (result.error) {
      dot.className = 'dot';
      text.textContent = '检查更新';
      if (manual) {
        showUpdateModal({error: result.error});
      }
      return;
    }

    if (result.has_update) {
      dot.className = 'dot has-update';
      text.textContent = '新版本 v' + result.latest_version;
      showUpdateModal(result);
    } else {
      dot.className = 'dot';
      text.textContent = '检查更新';
      if (manual) {
        showUpdateModal({no_update: true, current: result.current_version});
      }
    }
  }).catch(err => {
    btn.classList.remove('checking');
    _updateChecking = false;
    dot.className = 'dot';
    text.textContent = '检查更新';
    if (manual) {
      showUpdateModal({error: err.toString()});
    }
  });
}

// 启动时静默检查更新的回调
window._onSilentUpdateCheck = function(result) {
  if (result && result.has_update) {
    // 检查是否已跳过该版本
    if (isVersionSkipped(result.latest_version)) {
      return; // 用户已跳过此版本，不提示
    }
    const dot = document.getElementById('updateDot');
    const text = document.getElementById('updateBtnText');
    dot.className = 'dot has-update';
    text.textContent = '新版本 v' + result.latest_version;
    // 静默模式下只在日志区域显示提示，不弹窗
    addLog('发现新版本 v' + result.latest_version + '，点击右上角按钮查看详情', 'accent');
  }
};

// 下载进度回调
window._updateDownloadProgress = function(pct) {
  const bar = document.getElementById('updateDownloadBar');
  if (bar) {
    bar.style.width = pct + '%';
  }
  const text = document.getElementById('updateDownloadPct');
  if (text) {
    text.textContent = pct + '%';
  }
};

function showUpdateModal(info) {
  // 三种状态（出错 / 已最新 / 有新版）共用同一套工厂骨架
  if (info.error) {
    Modal.open({
      id: 'updateOverlay',
      icon: 'i-globe',
      title: '检查更新失败',
      desc: '网络连接失败，请稍后重试',
      body: '<p class="modal-note" style="text-align:center;">' + escapeHtml(info.error) + '</p>',
      actions: [{ text: '知道了', primary: true, onclick: () => Modal.close('updateOverlay') }],
    });
    return;
  }

  if (info.no_update) {
    Modal.open({
      id: 'updateOverlay',
      icon: 'i-check',
      title: '已是最新版本',
      desc: '当前版本 v' + escapeHtml(info.current || '1.0') + '，无需更新',
      actions: [{ text: '好的', primary: true, onclick: () => Modal.close('updateOverlay') }],
    });
    return;
  }

  const latest = String(info.latest_version || '');
  const notes = info.release_notes || '';
  const notesHtml = notes
    ? '<div class="code-box" style="margin-bottom:16px;max-height:150px;overflow-y:auto;">' +
      '<pre class="code-pre">' +
      escapeHtml(notes) + '</pre></div>'
    : '';

  const body =
    '<p class="modal-desc" style="color:var(--accent2);font-size:16px;font-weight:600;margin-bottom:4px;">v' + escapeHtml(latest) + '</p>' +
    '<p class="modal-desc" style="font-size:12px;margin-bottom:16px;">当前版本 v' + escapeHtml(info.current_version) + '</p>' +
    notesHtml +
    '<div id="updateDownloadArea" style="margin-bottom:16px;">' +
      '<div style="background:var(--panel-bg);border-radius:8px;height:8px;overflow:hidden;margin-bottom:6px;">' +
        '<div id="updateDownloadBar" style="height:100%;width:0%;border-radius:8px;background:var(--accent-grad);transition:width 0.3s ease;"></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);">' +
        '<span id="updateDownloadStatus">点击下方按钮开始下载</span>' +
        '<span id="updateDownloadPct">0%</span>' +
      '</div>' +
    '</div>';

  Modal.open({
    id: 'updateOverlay',
    icon: 'i-sparkle',
    title: '发现新版本',
    body: body,
    actions: [
      { text: '跳过此版本', onclick: () => skipUpdate(latest.replace(/[^0-9A-Za-z.]/g, '')) },
      { text: '稍后', onclick: () => Modal.close('updateOverlay') },
      { text: '<svg class="ico"><use href="#i-download"/></svg> 下载更新', primary: true, id: 'downloadUpdateBtn', onclick: downloadUpdate },
    ],
  });
}

function downloadUpdate() {
  const btn = document.getElementById('downloadUpdateBtn');
  const status = document.getElementById('updateDownloadStatus');
  btn.disabled = true;
  btn.textContent = '打开中...';
  status.textContent = '正在打开浏览器...';

      status.textContent = '已打开浏览器下载';

      // 替换弹窗内容为提示

      if (overlay) {
        overlay.innerHTML = `
          <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:30px;max-width:440px;width:90%;box-shadow:var(--shadow);animation:fadeInUp 0.4s ease;text-align:center;">
            <div style="font-size:44px;margin-bottom:14px;"><svg class="ico"><use href="#i-globe"/></svg></div>
            <h2 style="color:var(--text);margin-bottom:8px;font-size:20px;">已打开浏览器</h2>
            <p style="color:var(--text-dim);font-size:13px;margin-bottom:8px;line-height:1.6;">浏览器正在下载安装包，下载完成后运行安装即可。</p>
            <p style="color:var(--accent2);font-size:12px;margin-bottom:20px;">安装前请先关闭当前程序</p>
            <button onclick="document.getElementById('updateOverlay').remove()" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;width:100%;">知道了</button>
          </div>
        `;
      }
    } else {
      status.textContent = '打开失败';
      btn.disabled = false;
      btn.innerHTML = '<svg class="ico"><use href="#i-download"/></svg> 重新尝试';
      status.style.color = 'var(--error)';
      status.textContent = '失败: ' + (result.error || '未知错误');

function runInstaller(path) {
  pywebview.api.open_file(path).then(r => {
    if (r.success) {
      addLog('已启动安装程序，请关闭当前程序后继续安装', 'accent');
      document.getElementById('updateOverlay').remove();
    } else {
      addLog('启动安装程序失败: ' + r.error, 'error');
    }
  });
}

// 跳过此版本：记录到后端状态文件，不再提示
function skipUpdate(version) {
  patchUiState({ skip_version: version });
  addLog('已跳过 v' + version + '，下次有更新仍会提示', 'accent');
  const ov = document.getElementById('updateOverlay');
  if (ov) ov.remove();
}

// 检查是否已跳过该版本
function isVersionSkipped(version) {
  return _uiState.skip_version === version;
}

// 启动时自动检查更新（静默）
window.addEventListener('pywebviewready', () => {
  // Python端会在3秒后自动检查并通过_onSilentUpdateCheck回调通知
  // 这里不需要额外调用，Python端已经处理了
});


// ===== 提示词模板 =====
function loadPromptTemplates() {
  const box = document.getElementById('v3TplChips');
  if (!box) return;
  pywebview.api.list_prompt_templates().then(function (r) {
    const items = (r && r.items) || [];
    window._promptTemplates = items;
    if (!items.length) {
      box.innerHTML = '<span class="cp-empty">还没有保存的模板，写完提示词可点「存为模板」</span>';
      return;
    }
    box.innerHTML = '<span class="cp-tip">常用模板：</span>' + items.map(function (it, i) {
      return '<span class="cp-chip" data-i="' + i + '" onclick="usePromptTemplate(this.dataset.i)" title="' +
        escapeHtml(it.prompt) + '">' + escapeHtml(it.name) +
        '<span class="cp-del" data-name="' + escapeHtml(it.name) +
        '" onclick="event.stopPropagation();deletePromptTemplate(this.dataset.name)">×</span></span>';
    }).join('');
  }).catch(function () {});
}

function usePromptTemplate(idx) {
  const items = window._promptTemplates || [];
  const it = items[parseInt(idx, 10)];
  if (!it) return;
  const inp = document.getElementById('v3CustomPrompt');
  if (inp) {
    inp.value = it.prompt;
    inp.focus();
  }
}

function savePromptTemplate() {
  const inp = document.getElementById('v3CustomPrompt');
  const prompt = inp ? inp.value.trim() : '';
  if (!prompt) {
    addLog('先在输入框写下提示词，再点「存为模板」', 'warn');
    return;
  }
  window._pendingPrompt = prompt;

  Modal.open({
    id: 'tplNameOverlay',
    icon: 'i-download',
    title: '保存为模板',
    desc: '给这个提示词起个名字，下次可以一键套用',
    body: '<input id="tplNameInput" class="modal-input" placeholder="例如：促销风" maxlength="20" />' +
          '<p class="modal-note">将保存：' + escapeHtml(prompt.slice(0, 60)) +
          (prompt.length > 60 ? '…' : '') + '</p>',
    actions: [
      { text: '取消', onclick: function () { Modal.close('tplNameOverlay'); } },
      { text: '保存', primary: true, onclick: doSavePromptTemplate },
    ],
  });
  setTimeout(function () {
    const el = document.getElementById('tplNameInput');
    if (el) el.focus();
  }, 200);
}

function doSavePromptTemplate() {
  const el = document.getElementById('tplNameInput');
  const name = el ? el.value.trim() : '';
  if (!name) {
    addLog('请填写模板名称', 'warn');
    return;
  }
  pywebview.api.save_prompt_template(name, window._pendingPrompt || '').then(function (r) {
    if (!r || !r.success) {
      addLog((r && r.error) || '保存失败', 'error');
      return;
    }
    Modal.close('tplNameOverlay');
    addLog('模板「' + name + '」已保存', 'success');
    loadPromptTemplates();
  }).catch(function (e) { addLog('保存异常：' + e, 'error'); });
}

function deletePromptTemplate(name) {
  pywebview.api.delete_prompt_template(name).then(function (r) {
    if (!r || !r.success) {
      addLog((r && r.error) || '删除失败', 'error');
      return;
    }
    addLog('模板「' + name + '」已删除', 'accent');
    loadPromptTemplates();
  }).catch(function () {});
}


// ===== 文案历史版本 =====
function showCopyHistory(idx) {
  const v = window._copies && window._copies[idx];
  if (!v || !_outputDir) return;

  window._histVersion = v.key;
  window._histLabel = v.label;

  Modal.open({
    id: 'copyHistoryOverlay',
    icon: 'i-clock',
    title: v.label + ' · 历史版本',
    desc: '每次重新生成前会自动备份上一版，最多留 10 个',
    wide: true,
    body: '<div id="copyHistoryList"><p class="modal-note" style="text-align:center;">读取中…</p></div>',
    actions: [
      { text: '关闭', onclick: function () { Modal.close('copyHistoryOverlay'); } },
    ],
  });
  loadCopyHistory(v.key);
}

function loadCopyHistory(version) {
  const box = document.getElementById('copyHistoryList');
  if (!box) return;
  pywebview.api.list_copy_history(_outputDir, version).then(function (r) {
    if (!r || !r.success) {
      box.innerHTML = '<p class="modal-note" style="text-align:center;color:var(--error);">' +
        escapeHtml((r && r.error) || '读取失败') + '</p>';
      return;
    }
    const items = r.items || [];
    window._histItems = items;
    if (!items.length) {
      box.innerHTML = '<p class="modal-note" style="text-align:center;">这个版本还没有历史备份。<br>点标签上的刷新按钮重新生成，上一版会自动存下来。</p>';
      return;
    }
    box.innerHTML = items.map(function (it, i) {
      const t = it.time.replace('_', ' ');
      const timeText = t.length >= 15
        ? t.slice(0, 4) + '-' + t.slice(4, 6) + '-' + t.slice(6, 8) + ' ' +
          t.slice(9, 11) + ':' + t.slice(11, 13) + ':' + t.slice(13, 15)
        : it.time;
      return '<div class="hist-item">' +
        '<div class="hist-main">' +
          '<div class="hist-time">' + escapeHtml(timeText) + ' · ' + it.length + ' 字</div>' +
          '<div class="hist-preview">' + escapeHtml(it.text.slice(0, 70)) + '</div>' +
        '</div>' +
        '<button class="hi-btn" data-i="' + i + '" onclick="restoreHistory(this.dataset.i)">恢复</button>' +
        '<button class="hi-btn" data-i="' + i + '" onclick="deleteHistory(this.dataset.i)">删除</button>' +
      '</div>';
    }).join('');
  }).catch(function (e) {
    box.innerHTML = '<p class="modal-note" style="text-align:center;color:var(--error);">读取异常：' +
      escapeHtml(String(e)) + '</p>';
  });
}

function restoreHistory(i) {
  const items = window._histItems || [];
  const it = items[parseInt(i, 10)];
  const version = window._histVersion;
  if (!it || !version) return;

  pywebview.api.restore_copy_history(_outputDir, version, it.filename).then(function (r) {
    if (!r || !r.success) {
      addLog((r && r.error) || '恢复失败', 'error');
      return;
    }
    // 更新界面上的当前版本
    const idx = (window._copies || []).findIndex(function (x) { return x.key === version; });
    if (idx >= 0) {
      window._copies[idx].text = r.text;
      window._copies[idx].banned = [];
      switchCopy(idx);
    }
    Modal.close('copyHistoryOverlay');
    addLog('已恢复到 ' + it.time + ' 的版本（' + r.length + ' 字）', 'success');
  }).catch(function (e) { addLog('恢复异常：' + e, 'error'); });
}

function deleteHistory(i) {
  const items = window._histItems || [];
  const it = items[parseInt(i, 10)];
  const version = window._histVersion;
  if (!it || !version) return;

  pywebview.api.delete_copy_history(_outputDir, version, it.filename).then(function (r) {
    if (!r || !r.success) {
      addLog((r && r.error) || '删除失败', 'error');
      return;
    }
    addLog('已删除一条历史备份', 'accent');
    loadCopyHistory(version);
  }).catch(function () {});
}


// ===== 多源聚合搜图（独立触发）=====
let _msRunning = false;

function msBoxHtml() {
  return '<div class="ms-box">' +
    '<div class="ms-head">' +
      '<div><b>多源聚合搜图</b>' +
        '<span class="ms-hint">从百度识图、百度图片多个来源收集同款图，某个源失败不影响其他</span></div>' +

    '</div>' +
    '<div id="msResult"></div>' +
    '<div id="msPlatforms" class="ms-plats"></div>' +
  '</div>';
}

function collectMultiSource() {
  if (_msRunning) return;
  if (!_outputDir) {
    addLog('先处理一条商品链接，或者从历史记录里加载一个商品', 'warn');
    return;
  }

  _msRunning = true;
  const btn = document.getElementById('msBtn');
  const box = document.getElementById('msResult');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<svg class="ico spin-ico"><use href="#i-loader"/></svg> 搜索中…';
  }
  if (box) {
    box.innerHTML = '<p class="modal-note" style="text-align:center;">正在逐个来源搜索，大约需要 20-30 秒…</p>';
  }
  addLog('开始多源搜图（识图 + 关键词，约 25 秒）', 'accent');

  pywebview.api.collect_extra_images(_outputDir, 15).then(function (r) {
    _msRunning = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<svg class="ico"><use href="#i-search"/></svg> 重新搜图';
    }
    if (!r || !r.success) {
      const msg = (r && r.error) || '搜图失败';
      if (box) box.innerHTML = '<p class="modal-note" style="text-align:center;color:var(--error);">' + escapeHtml(msg) + '</p>';
      addLog('多源搜图失败：' + msg, 'error');
      return;
    }
    renderMsResult(r);
    // 只替换图片区，按钮和结果区保持原样
    pywebview.api.get_images(_outputDir, 'search').then(function (imgs) {
      const area = document.getElementById('searchImgArea');
      if (area) area.innerHTML = searchImgAreaHtml(imgs);
      addLog('补充图已刷新（' + (imgs ? imgs.length : 0) + ' 张）', 'success');
    });
  }).catch(function (e) {
    _msRunning = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<svg class="ico"><use href="#i-search"/></svg> 开始搜图';
    }
    addLog('多源搜图异常：' + e, 'error');
  });
}

function renderMsResult(r) {
  const box = document.getElementById('msResult');
  if (!box) return;

  const ICON = { ok: 'i-check', empty: 'i-info', failed: 'i-error',
                 unavailable: 'i-alert', skipped: 'i-info' };
  const LABEL = { ok: '成功', empty: '没搜到', failed: '失败',
                  unavailable: '不可用', skipped: '已跳过' };

  let html = '<div class="ms-summary">' + escapeHtml(r.summary || '') + '</div>';
  html += '<div class="ms-sources">';
  (r.sources || []).forEach(function (s) {
    const st = s.status || 'failed';
    const cnt = (s.count !== undefined) ? s.count : (s.images || []).length;
    html += '<div class="ms-src ms-src-' + st + '">' +
      '<svg class="ico"><use href="#' + (ICON[st] || 'i-info') + '"/></svg>' +
      '<span class="ms-name">' + escapeHtml(s.name) + '</span>' +
      '<span class="ms-status">' + (LABEL[st] || st) + '</span>' +
      (cnt ? '<span class="ms-count">' + cnt + ' 张</span>' : '') +
      (s.cost ? '<span class="ms-cost">' + s.cost + 's</span>' : '') +
      '<span class="ms-msg">' + escapeHtml(s.message || '') + '</span>' +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
  addLog(r.summary || '搜图完成', r.total ? 'success' : 'warn');
}


// ===== 电商平台评价图：登录状态与登录 =====
function loadPlatformStatus() {
  const box = document.getElementById('msPlatforms');
  if (!box) return;
  box.innerHTML = '<span class="ms-plat-hint">读取平台登录状态…</span>';

  pywebview.api.platform_login_status().then(function (r) {
    if (!r || !r.success) {
      box.innerHTML = '<span class="ms-plat-hint">读取失败：' +
        escapeHtml((r && r.error) || '未知错误') + '</span>';
      return;
    }
    renderPlatformStatus(r.platforms || []);
  }).catch(function () {
    box.innerHTML = '<span class="ms-plat-hint">读取登录状态失败</span>';
  });
}

function renderPlatformStatus(list) {
  const box = document.getElementById('msPlatforms');
  if (!box) return;

  // 淘宝/拼多多当前版本只标注不可用（接口要签名）
  const SUPPORTED = { jd: true };

  let html = '<span class="ms-plat-label">平台评价图：</span>';
  list.forEach(function (p) {
    const name = p.name || p.platform;
    const key = p.platform;
    if (!SUPPORTED[key]) {
      html += '<span class="ms-plat ms-plat-off" title="接口需要额外签名，当前版本不支持">' +
        escapeHtml(name) + ' 暂不支持</span>';
      return;
    }
    if (p.logged_in) {
      html += '<span class="ms-plat ms-plat-ok">' +
        '<svg class="ico"><use href="#i-check"/></svg> ' + escapeHtml(name) + ' 已登录</span>';
    } else {
      html += '<button class="ms-plat ms-plat-login" data-p="' + escapeHtml(key) +
        '" onclick="loginPlatform(this.dataset.p)">' +
        '<svg class="ico"><use href="#i-key"/></svg> 登录' + escapeHtml(name) + '</button>';
    }
  });
  box.innerHTML = html;
}

function loginPlatform(platform) {
  const btn = document.querySelector('.ms-plat-login[data-p="' + platform + '"]');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<svg class="ico spin-ico"><use href="#i-loader"/></svg> 等待登录…';
  }
  addLog('已打开登录窗口，请在浏览器里完成登录（最多等 4 分钟）', 'accent');

  pywebview.api.login_platform(platform).then(function (r) {
    if (!r || !r.success) {
      addLog('登录未完成：' + ((r && r.error) || '未知原因'), 'warn');
    } else {
      addLog(r.message || '登录成功', 'success');
    }
    loadPlatformStatus();
  }).catch(function (e) {
    addLog('登录异常：' + e, 'error');
    loadPlatformStatus();
  });
}
</script>
