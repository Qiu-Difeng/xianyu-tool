<head>
<meta charset="UTF-8">

<title>闲鱼辅助工具 · 冬夜漫步</title>
<style>
@keyframes snowfall {
  0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(105vh) translateX(40px) rotate(360deg); opacity: 0; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.08); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes spinEmoji {
  to { transform: rotate(360deg); }
}
.spinning {
  display: inline-block;
  animation: spinEmoji 1.5s linear infinite;
}

:root {
  --glass: rgba(10, 18, 40, 0.72);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-light: rgba(255, 255, 255, 0.08);
  --accent: #d4382e;
  --accent2: #f5a623;
  --accent-grad: linear-gradient(135deg, #d4382e 0%, #f5a623 100%);
  --text: #fff8ee;
  --text-dim: rgba(255, 248, 238, 0.65);
  --success: #7bed9f;
  --warn: #feca57;
  --error: #ff6b81;
  --radius: 20px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  color: var(--text);
  font-family: -apple-system, "Microsoft YaHei UI", "Segoe UI", sans-serif;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.wallpaper::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(8,15,35,0.55) 0%, rgba(8,15,35,0.45) 40%, rgba(8,15,35,0.6) 100%);
  backdrop-filter: blur(2px);
}

.stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1; }
.star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }

.snowflakes { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.snowflake { position: absolute; color: rgba(255,255,255,0.75); font-size: 14px; animation: snowfall linear infinite; text-shadow: 0 0 4px rgba(255,255,255,0.5); }

.header { display: flex; align-items: center; gap: 14px; padding: 22px 30px 14px; position: relative; z-index: 3; animation: fadeIn 0.6s ease; }
.header .logo-wrap { width: 46px; height: 46px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; backdrop-filter: blur(16px); box-shadow: var(--shadow), 0 0 20px rgba(245,166,35,0.15); animation: float 3s ease-in-out infinite; }
.header h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,0.3); }
.header h1 span { color: var(--accent2); font-weight: 400; }
.header .sub { font-size: 12px; color: var(--text-dim); margin-left: 10px; letter-spacing: 0.5px; }
.header .spacer { flex: 1; }

.search-max-wrap { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 0 16px; height: 54px; backdrop-filter: blur(20px); box-shadow: var(--shadow); }

.btn-run { height: 54px; padding: 0 36px; background: var(--accent-grad); background-size: 200% 100%; color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; box-shadow: 0 4px 24px rgba(212,56,46,0.45); white-space: nowrap; letter-spacing: 1px; }
.btn-run:hover { background-position: 100% 0; box-shadow: 0 6px 32px rgba(212,56,46,0.6); transform: translateY(-2px); }
.btn-run:active { transform: translateY(0) scale(0.97); }
.btn-run:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-run .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
.btn-run.loading .spinner { display: block; }
.btn-run.loading .icon-play { display: none; }

.status-progress { margin: 8px 30px 4px; display: flex; align-items: center; gap: 14px; position: relative; z-index: 3; }

.progress { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent-grad); background-size: 200% 100%; width: 0%; border-radius: 3px; transition: width 0.5s ease; animation: shimmer 2s linear infinite; box-shadow: 0 0 12px rgba(245,166,35,0.3); }

.log-section { margin: 12px 30px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); height: 120px; display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(24px); box-shadow: var(--shadow); position: relative; z-index: 3; }
.log-header { padding: 10px 18px 6px; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--glass-border); }
.log-box { flex: 1; overflow-y: auto; padding: 6px 18px 10px; font-family: "Cascadia Code", "Consolas", monospace; font-size: 11px; line-height: 1.8; }

.tabs { display: flex; gap: 4px; padding: 10px 30px 0; position: relative; z-index: 3; }
.tab-btn { padding: 12px 22px; background: var(--glass); border: 1px solid var(--glass-border); border-bottom: none; border-radius: 14px 14px 0 0; color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(16px); }
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }
.tab-btn.active { color: var(--text); background: rgba(245,166,35,0.15); border-color: rgba(245,166,35,0.3); border-bottom: 1px solid rgba(245,166,35,0.15); box-shadow: 0 -4px 20px rgba(245,166,35,0.1); }

.tab-content { flex: 1; margin: 0 30px 14px; background: var(--glass); border: 1px solid var(--glass-border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 20px; overflow-y: auto; backdrop-filter: blur(24px); box-shadow: var(--shadow); position: relative; z-index: 3; }

.info-card { background: var(--glass-light); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; }

.info-desc { margin-top: 16px; padding: 18px; background: rgba(0,0,0,0.2); border-radius: 16px; font-size: 13px; line-height: 2; white-space: pre-wrap; max-height: 220px; overflow-y: auto; border: 1px solid var(--glass-border); }

.btn-save { padding: 8px 18px; background: var(--glass-light); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 6px; }
.btn-save:hover { border-color: var(--accent2); color: var(--accent2); box-shadow: 0 0 16px rgba(245,166,35,0.15); }

.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.img-card { background: rgba(0,0,0,0.25); border-radius: 16px; overflow: hidden; aspect-ratio: 1; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 1px solid var(--glass-border); animation: fadeInUp 0.5s ease backwards; }
.img-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,0.45), 0 0 30px rgba(245,166,35,0.12); border-color: rgba(245,166,35,0.3); }
.img-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }

/* 文案 */
.copy-tabs { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

.search-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

.btn-refresh .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
.btn-refresh.loading .spinner { display: inline-block; }
.btn-refresh.loading .refresh-text { display: none; }

.footer { text-align: center; padding: 12px; font-size: 11px; color: var(--text-dim); background: rgba(0,0,0,0.3); border-top: 1px solid var(--glass-border); position: relative; z-index: 3; letter-spacing: 0.5px; backdrop-filter: blur(16px); }

.empty { color: var(--text-dim); text-align: center; padding: 70px 20px; font-size: 14px; }

.timing-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }

.timing-name { color: var(--text-dim); }

</style>
</head>
<body>

<div class="wallpaper"></div>
<div class="stars" id="stars"></div>
<div class="snowflakes" id="snowflakes"></div>

<div class="header">
  <div class="logo-wrap">🐟</div>
  <h1>闲鱼辅助工具 <span>· 冬夜漫步</span></h1>
  <span class="sub">链接解析 → 去水印 → 文案改写 → 以图搜图</span>
  <div class="spacer"></div>
  <button class="btn-update" id="updateBtn" onclick="checkUpdate(true)">
    <span class="dot" id="updateDot"></span>
    <span class="spinner"></span>
    <span class="icon-update">🔄</span>
    <span id="updateBtnText">检查更新</span>
  </button>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="粘贴闲鱼商品链接（如 https://m.tb.cn/h.xxx）" />
    <span class="icon-search">🔍</span>
  </div>
  <div class="search-max-wrap">
    <label>补充图</label>
    <input type="number" id="searchMax" value="15" min="5" max="30" />
    <span>张</span>
  </div>
  <button class="btn-run" id="runBtn" onclick="runTool()">
    <span class="spinner"></span>
    <span class="icon-play">▶</span>
    <span class="btn-text">开始</span>
  </button>
</div>

<div class="status-progress">
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">就绪 · 等待输入</span>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="log-section">
  <div class="log-header">❄️ 运行日志</div>
  <div class="log-box" id="logBox"></div>
</div>

<div class="tabs" id="tabBar">
  <button class="tab-btn active" onclick="switchTab(0)">📋 商品信息</button>
  <button class="tab-btn" onclick="switchTab(1)">🖼️ 原图</button>
  <button class="tab-btn" onclick="switchTab(2)">🧽 去水印</button>
  <button class="tab-btn" onclick="switchTab(3)">📝 文案</button>
  <button class="tab-btn" onclick="switchTab(4)">🔍 补充图</button>
  <button class="tab-btn" onclick="switchTab(5)">🎬 视频</button>
</div>

<div class="tab-content">
  <div class="tab-pane active" id="pane0">
    <div class="empty">
      <span class="emoji">🌨️</span>
      <p>输入链接后点击「开始」，和小新小白一起漫步吧~</p>
    </div>
  </div>
  <div class="tab-pane" id="pane1"></div>
  <div class="tab-pane" id="pane2"></div>
  <div class="tab-pane" id="pane3"></div>
  <div class="tab-pane" id="pane4"></div>
  <div class="tab-pane" id="pane5"></div>
</div>

<div class="footer">闲鱼辅助工具 v4.1 · 后台静默采集 · 一键复制 · V3自定义提示词 · <a href="#" onclick="showFeedback(); return false;" style="color:var(--accent2);text-decoration:none;">问题反馈</a> · <a href="#" onclick="checkUpdate(true); return false;" style="color:var(--accent2);text-decoration:none;">检查更新</a></div>

<script>
// 星空
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 55 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.animationDuration = (2 + Math.random() * 3) + 's';
  starsContainer.appendChild(star);
}

// 雪花
const snowContainer = document.getElementById('snowflakes');
for (let i = 0; i < 30; i++) {
  const flake = document.createElement('div');
  flake.className = 'snowflake';
  flake.textContent = Math.random() > 0.5 ? '❄' : '✦';
  flake.style.left = Math.random() * 100 + '%';
  flake.style.animationDuration = (6 + Math.random() * 10) + 's';
  flake.style.animationDelay = Math.random() * 12 + 's';
  flake.style.fontSize = (10 + Math.random() * 12) + 'px';
  flake.style.opacity = 0.4 + Math.random() * 0.5;
  snowContainer.appendChild(flake);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runTool();
});

// === 首次使用引导 ===
const GUIDE_KEY = 'xianyu_tool_guide_seen';

window.addEventListener('pywebviewready', () => {
  // 检查是否首次使用（localStorage在pywebview中可能不可用，用变量替代）
  if (!_guideSeen) {
    setTimeout(() => showGuide(), 800);
  }
});

let _guideSeen = false;

function showGuide() {
  const overlay = document.createElement('div');
  overlay.id = 'guideOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);animation:fadeIn 0.3s ease;';
  
  const steps = [
    { icon: '👋', title: '欢迎使用闲鱼辅助工具', desc: '帮你一键解析闲鱼商品、去水印、生成三版文案、搜补充图', },
    { icon: '🔗', title: '第一步：粘贴链接', desc: '把闲鱼商品分享链接粘贴到顶部输入框，点「开始处理」', },
    { icon: '🔑', title: '第二步：首次需扫码登录', desc: '首次使用会弹出Chrome窗口，扫码登录闲鱼即可，之后自动记住登录态', },
    { icon: '⚡', title: '第三步：等待处理完成', desc: '自动解析商品→下载图片→去水印→生成V1/V2/V3三版文案，约1-2分钟', },
    { icon: '💾', title: '第四步：保存结果', desc: '图片、文案、补充图都可以一键保存到你选的位置', },
    { icon: '❓', title: '遇到问题？', desc: '点击底部的「问题反馈」按钮描述你遇到的问题', },
  ];
  
  let currentStep = 0;
  
  function renderStep() {
    const step = steps[currentStep];
    const isLast = currentStep === steps.length - 1;
    const isFirst = currentStep === 0;
    
    overlay.innerHTML = `
      <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:36px;max-width:460px;width:90%;box-shadow:var(--shadow);text-align:center;animation:fadeInUp 0.4s ease;">
        <div style="font-size:48px;margin-bottom:16px;">${step.icon}</div>
        <h2 style="color:var(--text);margin-bottom:12px;font-size:20px;">${step.title}</h2>
        <p style="color:var(--text-dim);font-size:14px;line-height:1.8;margin-bottom:28px;">${step.desc}</p>
        
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px;">
          ${steps.map((_, i) => `<div style="width:${i === currentStep ? '24px' : '8px'};height:8px;border-radius:4px;background:${i === currentStep ? 'var(--accent2)' : 'rgba(255,255,255,0.2)'};transition:all 0.3s;"></div>`).join('')}
        </div>
        
        <div style="display:flex;gap:12px;">
          ${!isFirst ? '<button onclick="guidePrev()" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;">上一步</button>' : ''}
          ${isLast 
            ? '<button onclick="closeGuide()" style="flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent-grad);color:white;font-size:15px;font-weight:600;cursor:pointer;">✓ 开始使用</button>'
            : '<button onclick="guideNext()" style="flex:1;padding:12px;border-radius:10px;border:none;background:var(--accent-grad);color:white;font-size:15px;font-weight:600;cursor:pointer;">下一步</button>'}
        </div>
        ${isFirst ? '<p style="margin-top:16px;font-size:12px;color:var(--text-dim);cursor:pointer;" onclick="closeGuide()">跳过引导</p>' : ''}
      </div>
    `;
  }
  
  window.guideNext = () => { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } };
  window.guidePrev = () => { if (currentStep > 0) { currentStep--; renderStep(); } };
  window.closeGuide = () => { 
    document.getElementById('guideOverlay').remove();
    _guideSeen = true;
  };
  
  renderStep();
  document.body.appendChild(overlay);
}

// === 问题反馈 ===
function showFeedback() {
  const overlay = document.createElement('div');
  overlay.id = 'feedbackOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);animation:fadeIn 0.3s ease;';
  
  overlay.innerHTML = `
    <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:30px;max-width:440px;width:90%;box-shadow:var(--shadow);animation:fadeInUp 0.4s ease;">
      <h2 style="color:var(--text);margin-bottom:16px;text-align:center;">📝 问题反馈</h2>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">遇到bug或有建议？描述一下，复制后发邮件给卖家</p>
      
      <textarea id="feedbackContent" placeholder="请描述遇到的问题..." 
        style="width:100%;height:120px;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;resize:none;box-sizing:border-box;margin-bottom:12px;"></textarea>
      
      <input type="text" id="feedbackContact" placeholder="联系方式（选填，方便回复你）" 
        style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.3);color:var(--text);font-size:14px;margin-bottom:16px;box-sizing:border-box;" />
      
      <div style="display:flex;gap:12px;">
        <button onclick="document.getElementById('feedbackOverlay').remove()" 
          style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;">取消</button>
        <button onclick="submitFeedback()"

      <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;margin-bottom:16px;text-align:left;">
        <pre style="white-space:pre-wrap;word-wrap:break-word;color:var(--text);font-size:13px;line-height:1.6;margin:0;font-family:inherit;">${feedbackText}</pre>

      <div style="background:rgba(213,56,46,0.15);border-radius:10px;padding:14px;margin-bottom:16px;">
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">📧 卖家邮箱</p>
        <p style="font-size:16px;color:var(--accent2);font-weight:600;user-select:text;">3144994163@qq.com</p>
      </div>
      
      <button onclick="copyFeedbackText()" id="copyFbBtn" 
        style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent-grad);color:white;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;">📋 一键复制反馈内容</button>

        style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;">关闭</button>

  // 存到全局供复制用
  window._feedbackText = feedbackText;
}

function copyFeedbackText() {
  const text = window._feedbackText || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyFbBtn');
      btn.textContent = '✓ 已复制，发邮件给卖家';
      btn.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
    });

    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);

    document.body.removeChild(ta);
    const btn = document.getElementById('copyFbBtn');
    btn.textContent = '✓ 已复制，去QQ发给卖家';
    btn.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';

let _outputDir = null;
let _copiesData = null;

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab-pane').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function addLog(msg, type) {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = 'log-line' + (type ? ' ' + type : '');
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function clearLog() { document.getElementById('logBox').innerHTML = ''; }
function setStatus(msg, state) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusDot').className = 'status-dot' + (state ? ' ' + state : '');
}
function setProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }
function setBtnLoading(loading) {
  const btn = document.getElementById('runBtn');
  btn.classList.toggle('loading', loading);
  btn.disabled = loading;
  btn.querySelector('.btn-text').textContent = loading ? '运行中...' : '开始';
}

function runTool() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { setStatus('请输入链接！', 'error'); return; }

  // 简单链接验证
  if (!url.match(/https?:\/\/[\w\.-]+/i)) {
    setStatus('链接格式不正确，请粘贴闲鱼分享链接', 'error');
    addLog('💥 链接格式不正确', 'error');
    return;
  }

  const searchMax = parseInt(document.getElementById('searchMax').value) || 15;

  clearLog();
  addLog('🌨️ 开始处理，和小新小白一起漫步吧~', 'accent');
  setStatus('正在启动浏览器...', 'running');
  setProgress(5);
  setBtnLoading(true);

  // 进度模拟（实际进度由各阶段回调驱动）
  let fakeProgress = 5;
  const progressTimer = setInterval(() => {
    if (fakeProgress < 90) {
      fakeProgress += 1;
      setProgress(fakeProgress);
      if (fakeProgress === 15) setStatus('解析闲鱼链接...', 'running');
      if (fakeProgress === 30) setStatus('下载商品图片...', 'running');
      if (fakeProgress === 50) setStatus('去水印 + 生成文案...', 'running');
      if (fakeProgress === 80) setStatus('整理结果...', 'running');
    }
  }, 800);

  for (let i = 0; i < 6; i++) {
    document.getElementById('pane' + i).innerHTML = '<div class="empty"><span class="emoji spinning">⛄</span><p>处理中，请稍候...</p></div>';
  }

  pywebview.api.run_tool(url, searchMax).then(result => {
    clearInterval(progressTimer);
    setBtnLoading(false);
    if (result && result.success) {
      setProgress(100);
      addLog('✨ 全流程完成！耗时 ' + result.elapsed + '秒', 'success');
      setStatus('完成！耗时 ' + result.elapsed + '秒', 'done');
      displayResult(result);
    } else {
      const errMsg = (result && result.error) ? result.error : '未知错误，请检查链接是否有效';
      addLog('💥 处理失败: ' + errMsg, 'error');
      setStatus('失败: ' + errMsg.substring(0, 30), 'error');
      setProgress(0);
    }
  }).catch(err => {
    clearInterval(progressTimer);
    setBtnLoading(false);
    const errMsg = String(err).substring(0, 100);
    addLog('💥 错误: ' + errMsg, 'error');
    setStatus('运行出错', 'error');
    setProgress(0);
  });
}

function displayResult(result) {
  _outputDir = result.output_dir;

  // 商品信息 + 耗时
  let html = '<div class="info-card">';
  const info = [
    ['标题', result.title],
    ['价格', '¥' + result.price],
    ['卖家', result.seller],
    ['商品ID', result.item_id],
    ['文案字数', result.desc_len + ' 字'],
  ];
  info.forEach(([label, value]) => {
    html += '<div class="info-row"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  });
  html += '</div>';
  if (result.desc) {
    html += '<div class="info-desc">' + result.desc.replace(/</g, '&lt;') + '</div>';
  }
  // 耗时面板
  if (result.timings) {
    const t = result.timings;
    const maxT = Math.max(...Object.values(t));
    html += '<div class="timings"><h4>⏱ 各模块耗时</h4>';
    for (const [name, val] of Object.entries(t)) {
      const pct = (val / maxT * 100).toFixed(0);
      html += '<div class="timing-row"><span class="timing-name">' + name + '</span>' +
        '<div class="timing-bar"><div class="timing-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="timing-val">' + val + '秒</span></div>';
    }
    html += '</div>';
  }
  document.getElementById('pane0').innerHTML = html;

  // 原图
  pywebview.api.get_images(result.output_dir, 'original').then(imgs => {
    document.getElementById('pane1').innerHTML = renderImagesWithSave(imgs, 'original');
  });
  // 去水印
  pywebview.api.get_images(result.output_dir, 'clean').then(imgs => {
    document.getElementById('pane2').innerHTML = renderImagesWithSave(imgs, 'clean');
  });
  // 文案
  pywebview.api.get_copies(result.output_dir).then(data => {
    _copiesData = data;
    document.getElementById('pane3').innerHTML = renderCopies(data);
  });
  // 补充图
  document.getElementById('pane4').innerHTML = '<div class="empty"><span class="emoji">🔍</span><p>点击下方按钮搜索补充图</p>' +
    '<button class="btn-refresh" id="searchSupplementBtn" onclick="searchSupplementImages()" style="margin-top:12px;">🔍 搜索补充图</button></div>';
  // 视频
  if (result.video_url) {
    document.getElementById('pane5').innerHTML = '<div class="empty"><span class="emoji">🎬</span><p>该商品有视频</p>' +
      '<button class="btn-refresh" onclick="downloadVideo()" style="margin-top:12px;">⬇️ 保存视频</button></div>';
  } else {
    document.getElementById('pane5').innerHTML = '<div class="empty"><span class="emoji">🎬</span><p>该商品没有视频</p></div>';
  }
}

function renderImagesWithSave(imgs, subfolder) {
  if (!imgs || imgs.length === 0) return '<div class="empty"><span class="emoji">📷</span><p>无图片</p></div>';
  let html = '<div class="img-toolbar"><span class="img-count">共 ' + imgs.length + ' 张</span>' +
    '<button class="btn-save" onclick="saveImages(\'' + subfolder + '\')">💾 保存到...</button></div>';
  html += '<div class="img-grid">';
  imgs.forEach((src, i) => {
    html += '<div class="img-card" style="animation-delay:' + (i * 0.06) + 's"><img src="' + src + '" loading="lazy" /></div>';
  });
  return html + '</div>';
}

function renderSearchImages(imgs) {
  if (!imgs || imgs.length === 0) return '<div class="empty"><span class="emoji">🔍</span><p>无补充图，点击下方按钮搜索</p></div>';
  let html = '<div class="search-toolbar"><span class="img-count">共 ' + imgs.length + ' 张补充图</span>' +
    '<button class="btn-save" onclick="saveImages(\'search\')">💾 保存到...</button>' +
    '<button class="btn-refresh" id="refreshSearchBtn" onclick="searchSupplementImages()"><span class="refresh-text">🔄 重新搜索</span></button></div>';
  html += '<div class="img-grid">';
  imgs.forEach((src, i) => {
    html += '<div class="img-card" style="animation-delay:' + (i * 0.06) + 's"><img src="' + src + '" loading="lazy" /></div>';
  });
  return html + '</div>';
}

function saveImages(subfolder) {
  if (!_outputDir) return;
  pywebview.api.save_images(_outputDir, subfolder).then(r => {
    if (r.success) addLog('💾 已保存 ' + r.saved + ' 个文件到所选目录', 'success');
    else if (r.error !== '已取消') addLog('💾 保存失败: ' + r.error, 'error');
  });
}

function renderCopies(data) {
  if (!data.versions || data.versions.length === 0) return '<div class="empty"><span class="emoji">📝</span><p>无文案</p></div>';
  let html = '<div class="copy-tabs">';
  data.versions.forEach((v, i) => {
    html += '<div class="copy-tab' + (i === 0 ? ' active' : '') + '" onclick="switchCopy(' + i + ')" data-version="' + v.key + '">' +
      '<span>' + v.label + '</span><span class="refresh-icon" onclick="event.stopPropagation();refreshCopy(' + i + ')" title="重新生成">🔄</span></div>';
  });
  html += '</div><div id="copyBody"></div>';
  // V3自定义提示词区域
  html += '<div class="custom-prompt-area" style="margin-top:12px;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">';
  html += '<div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">💡 V3自定义提示词（可选，不填则默认重写）</div>';
  html += '<div style="display:flex;gap:8px;">';
  html += '<input type="text" id="v3CustomPrompt" placeholder="例如：突出性价比，加上使用场景，语气活泼一点" style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.3);color:var(--text);font-size:13px;" />';
  html += '<button class="btn-refresh" onclick="v3CustomRewrite()" style="white-space:nowrap;">🔄 按提示词重写</button>';
  html += '</div></div>';
  window._copies = data.versions;
  setTimeout(() => { switchCopy(0); }, 50);
  return html;
}

function switchCopy(idx) {
  document.querySelectorAll('.copy-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  const v = window._copies[idx];
  const badge = v.banned.length > 0
    ? '<span class="badge-warn">⚠️ 违禁词: ' + v.banned.join(',') + '</span>'
    : '<span class="badge-ok">✅ 零违禁词</span>';
  document.getElementById('copyBody').innerHTML =
    '<div class="copy-meta"><span>' + v.text.length + '字</span>' + badge +
    '<button class="btn-copy" onclick="copyText(' + idx + ')" style="margin-left:auto;padding:4px 12px;border-radius:6px;border:1px solid var(--glass-border);background:var(--glass-light);color:var(--text);cursor:pointer;font-size:12px;">📋 一键复制</button></div>' +
    '<div class="copy-content" id="copyText_' + idx + '">' + v.text.replace(/</g, '&lt;') + '</div>';
}

function refreshCopy(idx) {
  if (!_outputDir || !window._copies) return;
  const v = window._copies[idx];
  const tab = document.querySelectorAll('.copy-tab')[idx];
  const refreshIcon = tab.querySelector('.refresh-icon');
  refreshIcon.textContent = '⏳';

  addLog('🔄 重新生成 ' + v.label + '...', 'accent');

  pywebview.api.regenerate_copy(_outputDir, v.key).then(r => {
    if (r.success) {
      window._copies[idx].text = r.text;
      window._copies[idx].banned = r.banned;
      switchCopy(idx);
      addLog('✅ ' + v.label + ' 重新生成完成 (' + r.text.length + '字)', 'success');
    } else {
      addLog('💥 重新生成失败: ' + r.error, 'error');
    }
    refreshIcon.textContent = '🔄';
  });
}

function copyText(idx) {
  if (!window._copies) return;
  const text = window._copies[idx].text;
  const title = window._copies[idx].label;
  // 用clipboard API
  navigator.clipboard.writeText(text).then(() => {
    addLog('📋 已复制 ' + title + ' (' + text.length + '字)', 'success');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    addLog('📋 已复制 ' + title, 'success');
  });
}

function v3CustomRewrite() {
  if (!_outputDir || !window._copies) return;
  const prompt = document.getElementById('v3CustomPrompt').value.trim();
  if (!prompt) {
    setStatus('请输入自定义提示词', 'error');
    return;
  }
  addLog('🔄 V3按自定义提示词重写...', 'accent');
  pywebview.api.regenerate_copy(_outputDir, 'v3', prompt).then(r => {
    if (r.success) {
      window._copies[2].text = r.text;
      window._copies[2].banned = r.banned;
      switchCopy(2);
      addLog('✅ V3自定义重写完成 (' + r.text.length + '字)', 'success');
    } else {
      addLog('💥 V3重写失败: ' + r.error, 'error');
    }
  });
}

function downloadVideo() {
  if (!_outputDir) return;
  addLog('⬇️ 正在下载视频...', 'accent');
  pywebview.api.download_video(_outputDir).then(r => {
    if (r.success) {
      addLog('✅ 视频已保存: ' + r.path, 'success');
    } else {
      if (r.error !== '已取消') addLog('💥 视频下载失败: ' + r.error, 'error');
    }
  });
}

function searchSupplementImages() {
  if (!_outputDir) { setStatus('请先采集商品', 'error'); return; }
  const maxImg = parseInt(document.getElementById('searchMax').value) || 15;
  const btn = document.getElementById('searchSupplementBtn');
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  addLog('🔍 开始搜索补充图（最多' + maxImg + '张）...', 'accent');

  pywebview.api.refresh_search(_outputDir, maxImg).then(r => {
    if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
    if (r.success) {
      addLog('✅ 搜到 ' + r.count + ' 张补充图', 'success');

        document.getElementById('pane4').innerHTML = renderSearchImages(imgs);
      });

      addLog('💥 搜索失败: ' + r.error, 'error');
    }
  });
}

// === 检查更新 ===
let _updateChecking = false;

function checkUpdate(manual) {
  if (_updateChecking) return;
  _updateChecking = true;

  const btn = document.getElementById('updateBtn');
  const dot = document.getElementById('updateDot');
  const text = document.getElementById('updateBtnText');

  btn.classList.add('checking');
  dot.className = 'dot checking';
  text.textContent = '检查中...';

  pywebview.api.check_update().then(result => {
    btn.classList.remove('checking');
    _updateChecking = false;

    if (result.error) {
      dot.className = 'dot';
      text.textContent = '检查更新';
      if (manual) {
        showUpdateModal({error: result.error});
      }
      return;
    }

    if (result.has_update) {
      dot.className = 'dot has-update';
      text.textContent = '新版本 v' + result.latest_version;
      showUpdateModal(result);
    } else {
      dot.className = 'dot';
      text.textContent = '检查更新';
      if (manual) {
        showUpdateModal({no_update: true, current: result.current_version});
      }
    }
  }).catch(err => {
    btn.classList.remove('checking');
    _updateChecking = false;
    dot.className = 'dot';
    text.textContent = '检查更新';
    if (manual) {
      showUpdateModal({error: err.toString()});
    }
  });
}

// 启动时静默检查更新的回调
window._onSilentUpdateCheck = function(result) {
  if (result && result.has_update) {
    // 检查是否已跳过该版本
    if (isVersionSkipped(result.latest_version)) {
      return; // 用户已跳过此版本，不提示
    }
    const dot = document.getElementById('updateDot');
    const text = document.getElementById('updateBtnText');
    dot.className = 'dot has-update';
    text.textContent = '新版本 v' + result.latest_version;
    // 静默模式下只在日志区域显示提示，不弹窗
    addLog('✨ 发现新版本 v' + result.latest_version + '，点击右上角按钮查看详情', 'accent');
  }
};

// 下载进度回调
window._updateDownloadProgress = function(pct) {
  const bar = document.getElementById('updateDownloadBar');
  if (bar) {
    bar.style.width = pct + '%';
  }
  const text = document.getElementById('updateDownloadPct');
  if (text) {
    text.textContent = pct + '%';
  }
};

function showUpdateModal(info) {
  // 移除已有弹窗
  const existing = document.getElementById('updateOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'updateOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);animation:fadeIn 0.3s ease;';

  let contentHtml = '';

  if (info.error) {
    // 网络错误
    contentHtml = `
      <div style="font-size:44px;margin-bottom:14px;">📡</div>
      <h2 style="color:var(--text);margin-bottom:8px;font-size:20px;">检查更新失败</h2>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:20px;line-height:1.6;">网络连接失败，请稍后重试</p>
      <p style="color:var(--text-dim);font-size:11px;margin-bottom:20px;opacity:0.6;">${info.error}</p>
      <button onclick="document.getElementById('updateOverlay').remove()" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-light);color:var(--text);font-size:14px;cursor:pointer;">知道了</button>
    `;
  } else if (info.no_update) {
    // 已是最新
    contentHtml = `
      <div style="font-size:44px;margin-bottom:14px;">✅</div>
      <h2 style="color:var(--text);margin-bottom:8px;font-size:20px;">已是最新版本</h2>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">当前版本 v${info.current || '1.0'}，无需更新</p>
      <button onclick="document.getElementById('updateOverlay').remove()" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent-grad);color:white;font-size:15px;font-weight:600;cursor:pointer;">好的</button>
    `;
  } else {
    // 有新版本
    const notes = info.release_notes || '';
    const notesHtml = notes ? `
      <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:14px;margin-bottom:16px;max-height:150px;overflow-y:auto;">
        <pre style="white-space:pre-wrap;word-wrap:break-word;color:var(--text-dim);font-size:12px;line-height:1.6;margin:0;font-family:inherit;">${notes.replace(/</g, '&lt;')}</pre>
      </div>` : '';

    contentHtml = `
      <div style="font-size:44px;margin-bottom:14px;">✨</div>
      <h2 style="color:var(--text);margin-bottom:8px;font-size:20px;">发现新版本</h2>
      <p style="color:var(--accent2);font-size:16px;margin-bottom:6px;font-weight:600;">v${info.latest_version}</p>
      <p style="color:var(--text-dim);font-size:12px;margin-bottom:16px;">当前版本 v${info.current_version}</p>
      ${notesHtml}
      <div id="updateDownloadArea" style="margin-bottom:16px;">
        <div style="background:rgba(0,0,0,0.2);border-radius:8px;height:8px;overflow:hidden;margin-bottom:6px;">
          <div id="updateDownloadBar" style="height:100%;background:var(--accent-grad);background-size:200% 100%;width:0%;border-radius:8px;transition:width 0.3s ease;animation:shimmer 2s linear infinite;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);">
          <span id="updateDownloadStatus">点击下方按钮开始下载</span>
          <span id="updateDownloadPct">0%</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="skipUpdate('${info.latest_version}')" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;">跳过此版本</button>
        <button onclick="document.getElementById('updateOverlay').remove()" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;">稍后</button>
        <button id="downloadUpdateBtn" onclick="downloadUpdate()" style="flex:2;padding:12px;border-radius:10px;border:none;background:var(--accent-grad);color:white;font-size:15px;font-weight:600;cursor:pointer;">⬇️ 下载更新</button>
      </div>
    `;
  }

  overlay.innerHTML = `
    <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:30px;max-width:440px;width:90%;box-shadow:var(--shadow);animation:fadeInUp 0.4s ease;text-align:center;">
      ${contentHtml}
    </div>
  `;
  document.body.appendChild(overlay);
}

function downloadUpdate() {
  const btn = document.getElementById('downloadUpdateBtn');
  const status = document.getElementById('updateDownloadStatus');
  btn.disabled = true;
  btn.textContent = '打开中...';
  status.textContent = '正在打开浏览器...';

  pywebview.api.download_update().then(result => {
    if (result.success) {
      status.textContent = '已打开浏览器下载';
      btn.textContent = '✅ 已打开浏览器';

      // 替换弹窗内容为提示
      const overlay = document.getElementById('updateOverlay');
      if (overlay) {
        overlay.innerHTML = `
          <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:30px;max-width:440px;width:90%;box-shadow:var(--shadow);animation:fadeInUp 0.4s ease;text-align:center;">
            <div style="font-size:44px;margin-bottom:14px;">🌐</div>
            <h2 style="color:var(--text);margin-bottom:8px;font-size:20px;">已打开浏览器</h2>
            <p style="color:var(--text-dim);font-size:13px;margin-bottom:8px;line-height:1.6;">浏览器正在下载安装包，下载完成后运行安装即可。</p>
            <p style="color:var(--accent2);font-size:12px;margin-bottom:20px;">安装前请先关闭当前程序</p>
            <button onclick="document.getElementById('updateOverlay').remove()" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;width:100%;">知道了</button>
          </div>
        `;
      }
    } else {
      status.textContent = '打开失败';
      btn.disabled = false;
      btn.textContent = '⬇️ 重新尝试';
      status.style.color = 'var(--error)';
      status.textContent = '失败: ' + (result.error || '未知错误');
    }
  }).catch(err => {
    btn.disabled = false;
    btn.textContent = '⬇️ 重新下载';
    status.style.color = 'var(--error)';
    status.textContent = '失败: ' + err.toString();
  });
}

function runInstaller(path) {
  pywebview.api.open_file(path).then(r => {
    if (r.success) {
      addLog('📦 已启动安装程序，请关闭当前程序后继续安装', 'accent');
      document.getElementById('updateOverlay').remove();
    } else {
      addLog('💥 启动安装程序失败: ' + r.error, 'error');
    }
  });
}

// 跳过此版本：记录到localStorage，不再提示
function skipUpdate(version) {
  try {
    localStorage.setItem('skipVersion', version);
    addLog('⏭️ 已跳过 v' + version + '，下次有更新仍会提示', 'accent');
  } catch(e) {}
  document.getElementById('updateOverlay').remove();
}

// 检查是否已跳过该版本
function isVersionSkipped(version) {
  try {
    return localStorage.getItem('skipVersion') === version;
  } catch(e) {
    return false;
  }
}

// 启动时自动检查更新（静默）
window.addEventListener('pywebviewready', () => {
  // Python端会在3秒后自动检查并通过_onSilentUpdateCheck回调通知
  // 这里不需要额外调用，Python端已经处理了
});
</script>
</body>
</html>
